<svg xmlns="http://www.w3.org/2000/svg" viewBox="43 9 674 610" font-family="Arial">
  <defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs>
  <rect x="43" y="9" width="674" height="610" fill="#FFFFFF"/>
<circle cx="280" cy="34" r="9" fill="#1F2937"/>
  <text x="302" y="38" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">22:40  fall detected</text>
  <line x1="280" y1="43" x2="280" y2="58" stroke="#6B7280" stroke-width="2.4" marker-end="url(#arrG)"/>
  <rect x="60" y="58" width="640" height="10" rx="2" fill="#1F2937" stroke="#1F2937" stroke-width="1"/>
  <line x1="160" y1="68" x2="160" y2="88" stroke="#6B7280" stroke-width="2.4" marker-end="url(#arrG)"/>
  <line x1="600" y1="68" x2="600" y2="88" stroke="#6B7280" stroke-width="2.4" marker-end="url(#arrG)"/>
  <rect x="60" y="88" width="200" height="56" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
<text x="160.0" y="112" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">Notify the family contact</text>
<text x="160.0" y="135" text-anchor="middle" font-size="11.5" fill="#2563EB" font-weight="normal" font-style="normal">≤ 60 s, at p95</text>
  <rect x="500" y="88" width="200" height="56" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.2"/>
<text x="600.0" y="112" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">Notify the on-call nurse</text>
<text x="600.0" y="135" text-anchor="middle" font-size="11.5" fill="#0D9488" font-weight="normal" font-style="normal">same second</text>
  <line x1="160" y1="144" x2="160" y2="170" stroke="#6B7280" stroke-width="2.4" marker-end="url(#arrG)"/>
  <line x1="600" y1="144" x2="600" y2="170" stroke="#6B7280" stroke-width="2.4" marker-end="url(#arrG)"/>
  <rect x="60" y="170" width="640" height="10" rx="2" fill="#1F2937" stroke="#1F2937" stroke-width="1"/>
  <text x="130" y="196" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">fork: both branches always run</text>
  <line x1="280" y1="180" x2="280" y2="212" stroke="#6B7280" stroke-width="2.4" marker-end="url(#arrG)"/>
  <path d="M 280,212 L 390,248 L 280,284 L 170,248 Z" fill="#FFFFFF" stroke="#D97706" stroke-width="2.3"/>
  <text x="280" y="253" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">Acknowledgement recorded?</text>
  <line x1="280" y1="284" x2="280" y2="312" stroke="#2E7D46" stroke-width="2.4" marker-end="url(#arrGr)"/>
  <text x="294" y="304" text-anchor="start" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">[acknowledged]</text>
  <rect x="90" y="312" width="380" height="56" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
<text x="280.0" y="336" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">Nurse opens the case and dispatches</text>
<text x="280.0" y="359" text-anchor="middle" font-size="11.5" fill="#2563EB" font-weight="normal" font-style="normal">2 min</text>
  <line x1="280" y1="368" x2="280" y2="386" stroke="#6B7280" stroke-width="2.4" marker-end="url(#arrG)"/>
  <rect x="90" y="386" width="380" height="56" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
<text x="280.0" y="410" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">Caregiver accepts on the app</text>
<text x="280.0" y="433" text-anchor="middle" font-size="11.5" fill="#2563EB" font-weight="normal" font-style="normal">1 min</text>
  <line x1="280" y1="442" x2="280" y2="460" stroke="#6B7280" stroke-width="2.4" marker-end="url(#arrG)"/>
  <rect x="90" y="460" width="380" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2"/>
<text x="280.0" y="484" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">Caregiver drives to the flat</text>
<text x="280.0" y="507" text-anchor="middle" font-size="11.5" fill="#D97706" font-weight="normal" font-style="normal">45 min</text>
  <line x1="280" y1="516" x2="280" y2="536" stroke="#6B7280" stroke-width="2.4" marker-end="url(#arrK)"/>
  <circle cx="280" cy="550" r="11" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.6"/>
  <circle cx="280" cy="550" r="6" fill="#1F2937"/>
  <text x="304" y="555" text-anchor="start" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">caregiver on site at 23:32  —  52 minutes</text>
  <path d="M 390,248 L 445,248 L 445,326 L 494,326" fill="none" stroke="#D97706" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#arrA)"/>
  <text x="452" y="238" text-anchor="start" font-size="11.5" fill="#D97706" font-weight="bold" font-style="normal">no acknowledgement</text>
  <rect x="500" y="300" width="200" height="52" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2"/>
  <text x="600" y="323" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">Escalate to the second contact</text>
  <text x="600" y="340" text-anchor="middle" font-size="11.5" fill="#D97706" font-weight="normal" font-style="normal">timer: 3 min, then 8 min</text>
  <rect x="500" y="420" width="200" height="78" rx="10" fill="#DCFCE7" stroke="#2E7D46" stroke-width="2"/>
  <text x="600" y="446" text-anchor="middle" font-size="12.5" fill="#2E7D46" font-weight="bold" font-style="normal">cycle 52 min</text>
  <text x="600" y="466" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">touch 8 · waiting 2</text>
  <text x="600" y="484" text-anchor="middle" font-size="11.5" fill="#DC2626" font-weight="normal" font-style="normal">travel 42  —  the residual</text>
  <text x="380" y="600" text-anchor="middle" font-size="12" fill="#6B7280" font-weight="normal" font-style="italic">Three steps deleted, one pair parallelised, one capability automated — and one residual nobody can move.</text></svg>
