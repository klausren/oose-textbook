<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Arial">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <!-- ===== Panel A: Hardware bathtub curve ===== -->
  <text x="195" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F2937">Hardware: wears out</text>
  <!-- axes -->
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6B7280"/>
    </marker>
  </defs>
  <line x1="70" y1="270" x2="352" y2="270" stroke="#6B7280" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="70" y1="270" x2="70" y2="42" stroke="#6B7280" stroke-width="2" marker-end="url(#ah)"/>
  <text x="28" y="160" text-anchor="middle" font-size="15" fill="#6B7280" transform="rotate(-90 28 160)">Failure rate</text>
  <text x="212" y="300" text-anchor="middle" font-size="15" fill="#6B7280">Time</text>
  <!-- bathtub curve -->
  <path d="M 80,105 C 95,205 105,235 140,235 L 245,235 C 280,235 300,200 322,155 C 328,142 332,130 338,118"
        fill="none" stroke="#2563EB" stroke-width="3.5"/>
  <text x="103" y="180" text-anchor="middle" font-size="14" fill="#6B7280">infant</text>
  <text x="103" y="196" text-anchor="middle" font-size="14" fill="#6B7280">mortality</text>
  <text x="196" y="222" text-anchor="middle" font-size="14" fill="#6B7280">useful life</text>
  <text x="300" y="132" text-anchor="middle" font-size="14" fill="#6B7280">wear-out</text>

  <!-- ===== Panel B: Software deterioration ===== -->
  <text x="565" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F2937">Software: deteriorates</text>
  <line x1="400" y1="270" x2="682" y2="270" stroke="#6B7280" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="400" y1="270" x2="400" y2="42" stroke="#6B7280" stroke-width="2" marker-end="url(#ah)"/>
  <text x="358" y="160" text-anchor="middle" font-size="15" fill="#6B7280" transform="rotate(-90 358 160)">Failure rate</text>
  <text x="542" y="300" text-anchor="middle" font-size="15" fill="#6B7280">Time</text>
  <!-- idealized dashed -->
  <line x1="400" y1="250" x2="680" y2="250" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="540" y="242" text-anchor="middle" font-size="14" fill="#9CA3AF">idealized curve (no change)</text>
  <!-- actual: spikes + rising baseline -->
  <path d="M 400,255 L 448,255 L 456,128 L 464,248 L 502,248 L 510,112 L 518,243 L 558,243 L 566,98 L 574,238 L 618,238 L 626,88 L 634,232 L 680,232"
        fill="none" stroke="#DC2626" stroke-width="3.5" stroke-linejoin="round"/>
  <text x="512" y="92" text-anchor="middle" font-size="14" fill="#DC2626">each spike = a change</text>
  <text x="648" y="266" text-anchor="middle" font-size="14" fill="#6B7280">rising baseline:</text>
  <text x="648" y="283" text-anchor="middle" font-size="14" fill="#6B7280">accumulated deterioration</text>
</svg>
