<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" font-family="Arial">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="t" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/>
    </marker>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- elder's home -->
  <rect x="25" y="95" width="150" height="160" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2.5"/>
  <text x="100" y="122" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">Elder's Home</text>
  <text x="100" y="150" text-anchor="middle" font-size="12" fill="#6B7280">wristband · heart rate</text>
  <text x="100" y="170" text-anchor="middle" font-size="12" fill="#6B7280">fall · motion · kettle</text>
  <text x="100" y="232" text-anchor="middle" font-size="15" font-style="italic" fill="#1F2937">Grandma Lin</text>

  <!-- platform -->
  <rect x="285" y="115" width="190" height="120" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
  <text x="380" y="150" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F2937">CareLink</text>
  <text x="380" y="176" text-anchor="middle" font-size="13" fill="#374151">signal fusion · alert levels</text>
  <text x="380" y="197" text-anchor="middle" font-size="13" fill="#374151">daily report · escalation</text>

  <!-- family app -->
  <rect x="565" y="40" width="180" height="85" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5"/>
  <text x="655" y="68" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">Family App</text>
  <text x="655" y="90" text-anchor="middle" font-size="12" fill="#6B7280">status · alerts · summary</text>
  <text x="655" y="113" text-anchor="middle" font-size="15" font-style="italic" fill="#1F2937">Wei (son)</text>

  <!-- care center -->
  <rect x="565" y="160" width="180" height="85" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="655" y="188" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">Care Center 24/7</text>
  <text x="655" y="210" text-anchor="middle" font-size="12" fill="#6B7280">triage · call · verify</text>
  <text x="655" y="233" text-anchor="middle" font-size="15" font-style="italic" fill="#1F2937">operator Yan</text>

  <!-- emergency -->
  <rect x="565" y="290" width="180" height="60" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="655" y="314" text-anchor="middle" font-size="16" font-weight="bold" fill="#991B1B">Emergency services</text>
  <text x="655" y="336" text-anchor="middle" font-size="12" fill="#991B1B">last resort · L3 only</text>

  <!-- arrows (lengthened) -->
  <line x1="179" y1="175" x2="281" y2="175" stroke="#2563EB" stroke-width="3" marker-end="url(#b)"/>
  <text x="230" y="160" text-anchor="middle" font-size="12" fill="#2563EB">vitals &amp; events</text>

  <line x1="479" y1="140" x2="559" y2="124" stroke="#0D9488" stroke-width="3" marker-end="url(#t)"/>
  <text x="505" y="106" text-anchor="middle" font-size="12" fill="#0D9488">status &amp; alerts</text>

  <line x1="479" y1="195" x2="561" y2="202" stroke="#D97706" stroke-width="3" marker-end="url(#a)"/>
  <text x="520" y="180" text-anchor="middle" font-size="12" fill="#D97706">urgent alerts</text>

  <line x1="655" y1="249" x2="655" y2="286" stroke="#DC2626" stroke-width="3" marker-end="url(#r)"/>
  <text x="672" y="272" font-size="12" fill="#DC2626">dispatch</text>
</svg>
