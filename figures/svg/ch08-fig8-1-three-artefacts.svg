<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 11 752 459" font-family="Arial"><defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs><rect x="3" y="11" width="752" height="459" fill="#FFFFFF"/><text x="380" y="38" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold" font-style="normal">Three artefacts, three questions</text><rect x="20" y="64" width="226" height="360" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2"/><rect x="20" y="64" width="226" height="52" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/><text x="133" y="88" text-anchor="middle" font-size="12.5" fill="#2563EB" font-weight="bold" font-style="normal">Domain model</text><text x="133" y="105" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">a model of the problem</text><text x="34" y="138" text-anchor="start" font-size="11.5" fill="#2563EB" font-weight="bold" font-style="normal">MODELS</text><text x="34" y="158" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">the problem</text><text x="34" y="182" text-anchor="start" font-size="11.5" fill="#2563EB" font-weight="bold" font-style="normal">CONTAINS</text><text x="34" y="202" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">concepts, attributes,</text><text x="34" y="217" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">associations, multiplicities</text><text x="34" y="241" text-anchor="start" font-size="11.5" fill="#2563EB" font-weight="bold" font-style="normal">ANSWERS</text><text x="34" y="261" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">what this organisation knows</text><text x="34" y="276" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">about the care it delivers</text><text x="34" y="300" text-anchor="start" font-size="11.5" fill="#2563EB" font-weight="bold" font-style="normal">READER</text><text x="34" y="320" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Deng, Wei and Mei — the</text><text x="34" y="335" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">people whose world it describes</text><text x="34" y="359" text-anchor="start" font-size="11.5" fill="#2563EB" font-weight="bold" font-style="normal">CHANGES WHEN</text><text x="34" y="379" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">our understanding changes</text><rect x="266" y="64" width="226" height="360" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="2.2"/><rect x="266" y="64" width="226" height="52" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.2"/><text x="379" y="88" text-anchor="middle" font-size="12.5" fill="#0D9488" font-weight="bold" font-style="normal">Design class diagram</text><text x="379" y="105" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">a model of the solution</text><text x="280" y="138" text-anchor="start" font-size="11.5" fill="#0D9488" font-weight="bold" font-style="normal">MODELS</text><text x="280" y="158" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">the solution</text><text x="280" y="182" text-anchor="start" font-size="11.5" fill="#0D9488" font-weight="bold" font-style="normal">CONTAINS</text><text x="280" y="202" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">classes, operations, types,</text><text x="280" y="217" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">visibility, design patterns</text><text x="280" y="241" text-anchor="start" font-size="11.5" fill="#0D9488" font-weight="bold" font-style="normal">ANSWERS</text><text x="280" y="261" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">which object does what, and</text><text x="280" y="276" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">what it depends on</text><text x="280" y="300" text-anchor="start" font-size="11.5" fill="#0D9488" font-weight="bold" font-style="normal">READER</text><text x="280" y="320" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">the developers who build it</text><text x="280" y="359" text-anchor="start" font-size="11.5" fill="#0D9488" font-weight="bold" font-style="normal">CHANGES WHEN</text><text x="280" y="379" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">the design changes</text><rect x="512" y="64" width="226" height="360" rx="10" fill="#FFFFFF" stroke="#2E7D46" stroke-width="2.2"/><rect x="512" y="64" width="226" height="52" rx="10" fill="#DCFCE7" stroke="#2E7D46" stroke-width="2.2"/><text x="625" y="88" text-anchor="middle" font-size="12.5" fill="#2E7D46" font-weight="bold" font-style="normal">Database schema</text><text x="625" y="105" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">a model of the store</text><text x="526" y="138" text-anchor="start" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">MODELS</text><text x="526" y="158" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">the store</text><text x="526" y="182" text-anchor="start" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">CONTAINS</text><text x="526" y="202" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">tables, columns, keys,</text><text x="526" y="217" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">indexes, constraints</text><text x="526" y="241" text-anchor="start" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">ANSWERS</text><text x="526" y="261" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">how the model is persisted</text><text x="526" y="276" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">and queried</text><text x="526" y="300" text-anchor="start" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">READER</text><text x="526" y="320" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">whoever operates the store</text><text x="526" y="359" text-anchor="start" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">CHANGES WHEN</text><text x="526" y="379" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">volume, latency or access</text><text x="526" y="394" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">pattern changes</text><text x="380" y="452" text-anchor="middle" font-size="12" fill="#6B7280" font-weight="normal" font-style="italic">The reader row decides whether the people whose world the model describes can still read it.</text></svg>