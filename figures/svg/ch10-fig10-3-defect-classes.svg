<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" font-family="Arial"><defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs><rect x="0" y="0" width="760" height="456" fill="#FFFFFF"/><text x="10" y="40" text-anchor="start" font-size="17" fill="#1F2937" font-weight="bold" font-style="normal">Four ways a requirement goes wrong</text><text x="10" y="62" text-anchor="start" font-size="12.5" fill="#6B7280" font-weight="normal" font-style="normal">One CareLink example per class, all four found in the same review</text><rect x="10" y="84" width="360" height="152" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="24" y="110" text-anchor="start" font-size="13.5" fill="#2563EB" font-weight="bold" font-style="normal">Omission</text><text x="190" y="134" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Something that must happen is not written down anywhere.</text><line x1="24" y1="160" x2="356" y2="160" stroke="#2563EB" stroke-width="1.4"/><text x="24" y="180" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">R-055 covers the acknowledgement that stops an escalation.</text><text x="24" y="195" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">No requirement covers what happens when the escalation is</text><text x="24" y="210" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">never acknowledged at all.</text><rect x="390" y="84" width="360" height="152" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/><text x="404" y="110" text-anchor="start" font-size="13.5" fill="#0D9488" font-weight="bold" font-style="normal">Conflict</text><text x="570" y="134" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Two requirements cannot both hold at the same time.</text><line x1="404" y1="160" x2="736" y2="160" stroke="#0D9488" stroke-width="1.4"/><text x="404" y="180" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">R-055 escalates to the second contact at eight minutes.</text><text x="404" y="195" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">R-061 notifies the neighbour at ten, and nothing says</text><text x="404" y="210" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">whether the escalation pauses.</text><rect x="10" y="256" width="360" height="152" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="24" y="282" text-anchor="start" font-size="13.5" fill="#D97706" font-weight="bold" font-style="normal">Ambiguity</text><text x="190" y="306" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Two readers, two defensible readings, one sentence.</text><line x1="24" y1="332" x2="356" y2="332" stroke="#D97706" stroke-width="1.4"/><text x="24" y="352" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">R-056: “an alert cannot be closed without a recorded safety</text><text x="24" y="367" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">confirmation.” Recorded by whom, and does a photograph</text><text x="24" y="382" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">count?</text><rect x="390" y="256" width="360" height="152" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="404" y="282" text-anchor="start" font-size="13.5" fill="#DC2626" font-weight="bold" font-style="normal">Gold-plating</text><text x="570" y="306" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">A capability nobody asked for, carried at full cost.</text><line x1="404" y1="332" x2="736" y2="332" stroke="#DC2626" stroke-width="1.4"/><text x="404" y="352" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">The v1 specification includes a monthly PDF report that no</text><text x="404" y="367" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">stakeholder in chapters 4 to 7 ever requested or would open.</text><text x="380" y="438" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold" font-style="normal">The first three are defects in the specification. The fourth is a defect in the process that let it in.</text></svg>