<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 63 690 380" font-family="Arial">
  <defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs>
  <rect x="25" y="63" width="690" height="380" fill="#FFFFFF"/>
<rect x="42" y="80" width="146" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
  <text x="115" y="112" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">Listen to the user</text>
  <text x="115" y="134" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">collect a wish, not a spec</text>
  <line x1="188" y1="118" x2="208" y2="118" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB)"/>
  <rect x="212" y="80" width="146" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
  <text x="285" y="112" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">Build a mock-up</text>
  <text x="285" y="134" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">days, not months</text>
  <line x1="358" y1="118" x2="378" y2="118" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB)"/>
  <rect x="382" y="80" width="146" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
  <text x="455" y="112" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">User test-drives it</text>
  <text x="455" y="134" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">watch, do not ask</text>
  <line x1="528" y1="118" x2="548" y2="118" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB)"/>
  <rect x="552" y="80" width="146" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
  <text x="625" y="112" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">Revise the mock-up</text>
  <text x="625" y="134" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">the requirement moves</text>
  <path d="M 625,156 L 625,214 L 115,214 L 115,162" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrA)"/>
  <text x="370" y="238" text-anchor="middle" font-size="12" fill="#D97706" font-weight="normal" font-style="italic">repeat until the requirements become clear</text>
  <text x="370" y="268" text-anchor="middle" font-size="12.5" fill="#6B7280" font-weight="bold" font-style="normal">then the team chooses one of two roads:</text>
  <rect x="42" y="284" width="300" height="106" rx="10" fill="#FFFFFF" stroke="#2E7D46" stroke-width="2.2"/>
  <rect x="42" y="284" width="300" height="34" rx="10" fill="#DCFCE7" stroke="#2E7D46" stroke-width="2.2"/>
  <text x="192" y="306" text-anchor="middle" font-size="13" fill="#2E7D46" font-weight="bold" font-style="normal">Throwaway prototyping</text>
  <text x="192" y="336" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">The mock-up taught you what to build. Discard</text>
<text x="192" y="351" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">it and build the real system properly.</text>
  <rect x="398" y="284" width="300" height="106" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2.2"/>
  <rect x="398" y="284" width="300" height="34" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2"/>
  <text x="548" y="306" text-anchor="middle" font-size="13" fill="#D97706" font-weight="bold" font-style="normal">Evolutionary prototyping</text>
  <text x="548" y="336" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">The prototype is promoted to the product —</text>
<text x="548" y="351" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">defensible only if it was built to be</text>
<text x="548" y="366" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">maintained.</text>
  <text x="380" y="424" text-anchor="middle" font-size="12.5" fill="#6B7280" font-weight="normal" font-style="italic">The classic failure is not the prototype. It is shipping it.</text></svg>
