<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="Arial"><defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs><rect x="0" y="0" width="760" height="390" fill="#FFFFFF"/><text x="10" y="40" text-anchor="start" font-size="17" fill="#1F2937" font-weight="bold" font-style="normal">AI-assisted requirement review, with verification</text><text x="10" y="62" text-anchor="start" font-size="12.5" fill="#6B7280" font-weight="normal" font-style="normal">The model drafts; the human is accountable for every confirmed defect</text><rect x="10" y="84" width="171" height="168" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="22" y="108" text-anchor="start" font-size="13" fill="#2563EB" font-weight="bold" font-style="normal">Human</text><text x="95.5" y="130" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Supplies the</text><text x="95.5" y="145" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">specification and the</text><text x="95.5" y="160" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">interview records it</text><text x="95.5" y="175" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">claims to come from. No</text><text x="95.5" y="190" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">summary, no paraphrase.</text><line x1="184" y1="168" x2="197" y2="168" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arrV)"/><rect x="200" y="84" width="171" height="168" rx="10" fill="#EDE7F6" stroke="#6D3FA8" stroke-width="2"/><text x="212" y="108" text-anchor="start" font-size="13" fill="#6D3FA8" font-weight="bold" font-style="normal">AI</text><text x="285.5" y="130" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Lists suspected defects:</text><text x="285.5" y="145" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">sentences with no source,</text><text x="285.5" y="160" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">pairs that conflict,</text><text x="285.5" y="175" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">terms used two ways,</text><text x="285.5" y="190" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">capabilities nobody asked</text><text x="285.5" y="205" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">for.</text><line x1="374" y1="168" x2="387" y2="168" stroke="#6D3FA8" stroke-width="2.4" marker-end="url(#arrV)"/><rect x="390" y="84" width="171" height="168" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="402" y="108" text-anchor="start" font-size="13" fill="#2563EB" font-weight="bold" font-style="normal">Human</text><text x="475.5" y="130" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Checks each suggestion</text><text x="475.5" y="145" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">against the source. Keeps</text><text x="475.5" y="160" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">the real ones, discards</text><text x="475.5" y="175" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">the plausible ones,</text><text x="475.5" y="190" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">records why.</text><line x1="564" y1="168" x2="577" y2="168" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arrV)"/><rect x="580" y="84" width="171" height="168" rx="10" fill="#DCFCE7" stroke="#2E7D46" stroke-width="2"/><text x="592" y="108" text-anchor="start" font-size="13" fill="#2E7D46" font-weight="bold" font-style="normal">Confirmed list</text><text x="665.5" y="130" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">What reaches the customer</text><text x="665.5" y="145" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">is only what a person has</text><text x="665.5" y="160" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">verified. The rejected</text><text x="665.5" y="175" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">suggestions are kept as</text><text x="665.5" y="190" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">evidence of the check.</text><rect x="10" y="278" width="740" height="74" rx="10" fill="#EDE7F6" stroke="#6D3FA8" stroke-width="2"/><text x="26" y="302" text-anchor="start" font-size="12" fill="#6D3FA8" font-weight="bold" font-style="normal">Verify before you trust: a defect list is a set of claims, and every claim needs a source before it reaches a customer.</text><text x="26" y="324" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">An AI suggestion with no interview record behind it is a hypothesis, not a finding.</text></svg>