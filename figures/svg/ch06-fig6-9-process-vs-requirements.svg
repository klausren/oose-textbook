<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial">
  <defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs>
  <rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<rect x="40" y="60" width="290" height="278" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2"/>
  <rect x="40" y="60" width="290" height="46" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
  <text x="185" y="89" text-anchor="middle" font-size="14" fill="#2563EB" font-weight="bold" font-style="normal">The process model</text>
  <text x="56" y="128" text-anchor="start" font-size="10.5" fill="#6B7280" font-weight="bold" font-style="normal">It answers</text>
  <text x="56" y="148" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">How does the work happen, and where does</text>
<text x="56" y="163" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">it stall?</text>
  <line x1="50" y1="184" x2="320" y2="184" stroke="#F5F6F7" stroke-width="1.4"/>
  <text x="56" y="206" text-anchor="start" font-size="10.5" fill="#6B7280" font-weight="bold" font-style="normal">It gives you</text>
  <text x="56" y="226" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">triggers · actors · conditions · data</text>
  <line x1="50" y1="262" x2="320" y2="262" stroke="#F5F6F7" stroke-width="1.4"/>
  <text x="56" y="284" text-anchor="start" font-size="10.5" fill="#6B7280" font-weight="bold" font-style="normal">It cannot give you</text>
  <text x="56" y="304" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">numbers · quality attributes · the</text>
<text x="56" y="319" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">residual</text>
  <rect x="430" y="60" width="290" height="278" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="2.2"/>
  <rect x="430" y="60" width="290" height="46" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.2"/>
  <text x="575" y="89" text-anchor="middle" font-size="14" fill="#0D9488" font-weight="bold" font-style="normal">The specification</text>
  <text x="446" y="128" text-anchor="start" font-size="10.5" fill="#6B7280" font-weight="bold" font-style="normal">It answers</text>
  <text x="446" y="148" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">What must the system do, and how will we</text>
<text x="446" y="163" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">check it?</text>
  <line x1="440" y1="184" x2="710" y2="184" stroke="#F5F6F7" stroke-width="1.4"/>
  <text x="446" y="206" text-anchor="start" font-size="10.5" fill="#6B7280" font-weight="bold" font-style="normal">It gives you</text>
  <text x="446" y="226" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">metrics · pass/fail criteria ·</text>
<text x="446" y="241" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">traceability</text>
  <line x1="440" y1="262" x2="710" y2="262" stroke="#F5F6F7" stroke-width="1.4"/>
  <text x="446" y="284" text-anchor="start" font-size="10.5" fill="#6B7280" font-weight="bold" font-style="normal">It cannot give you</text>
  <text x="446" y="304" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">handoffs · queues · what not to build</text>
  <rect x="40" y="356" width="680" height="44" rx="10" fill="#FAFAFA" stroke="#C9D4E2" stroke-width="1.6"/>
  <text x="380" y="384" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="normal" font-style="normal">The model shows you what not to build. The specification shows you what to build.</text></svg>
