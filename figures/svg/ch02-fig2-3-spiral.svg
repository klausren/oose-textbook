<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Arial">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="430" fill="#FFFFFF"/>

  <!-- axes through center (380, 220) -->
  <g stroke="#9CA3AF" stroke-width="1.5">
    <line x1="20" y1="220" x2="740" y2="220"/>
    <line x1="380" y1="15" x2="380" y2="425"/>
  </g>

  <!-- quadrant labels (placed in the four corners, clear of the spiral) -->
  <g font-size="14" fill="#1F2937" text-anchor="middle">
    <text x="110" y="50">1. Determine objectives,</text>
    <text x="110" y="70">alternatives &amp; constraints</text>
    <text x="650" y="50">2. Evaluate alternatives,</text>
    <text x="650" y="70">identify &amp; resolve risks</text>
    <text x="650" y="365">3. Develop &amp; verify</text>
    <text x="650" y="385">next-level product</text>
    <text x="110" y="365">4. Plan the</text>
    <text x="110" y="385">next iteration</text>
  </g>

  <!-- spiral: growing semicircles around the center -->
  <path d="M 398,220
           A 18,18 0 0 1 362,220
           A 48,48 0 0 1 428,220
           A 82,82 0 0 1 298,220
           A 120,120 0 0 1 500,220
           A 160,160 0 0 1 220,220"
        fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrB)"/>

  <!-- center dot -->
  <circle cx="380" cy="220" r="4.5" fill="#1F2937"/>

  <!-- note at bottom center, clear of quadrant labels -->
  <text x="380" y="418" text-anchor="middle" font-size="13.5" font-style="italic" fill="#6B7280">each loop = one iteration &#183; the growing radius &#8776; cumulative cost</text>
</svg>
