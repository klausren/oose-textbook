  <rect x="0" y="0" width="760" height="322" fill="#FFFFFF"/>
<rect x="30" y="70" width="132" height="82" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
  <text x="96" y="100" text-anchor="middle" font-size="13.5" fill="#2563EB" font-weight="bold" font-style="normal">Consolidate</text>
  <text x="96" y="122" text-anchor="middle" font-size="10" fill="#6B7280" font-weight="normal" font-style="normal">merge duplicates</text>
  <text x="96" y="137" text-anchor="middle" font-size="10" fill="#6B7280" font-weight="normal" font-style="normal">keeps every source</text>
  <text x="96" y="186" text-anchor="middle" font-size="11" fill="#2563EB" font-weight="normal" font-style="normal">duplicates removed</text>
  <line x1="162" y1="111" x2="170" y2="111" stroke="#1F2937" stroke-width="2.4" marker-end="url(#arrK)"/>
  <rect x="172" y="70" width="132" height="82" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.2"/>
  <text x="238" y="100" text-anchor="middle" font-size="13.5" fill="#0D9488" font-weight="bold" font-style="normal">Classify</text>
  <text x="238" y="122" text-anchor="middle" font-size="10" fill="#6B7280" font-weight="normal" font-style="normal">functional, NFR, constraint,</text>
  <text x="238" y="137" text-anchor="middle" font-size="10" fill="#6B7280" font-weight="normal" font-style="normal">design decision, wish</text>
  <text x="238" y="186" text-anchor="middle" font-size="11" fill="#0D9488" font-weight="normal" font-style="normal">design moved to the</text>
