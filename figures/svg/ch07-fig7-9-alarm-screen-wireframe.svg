  <text x="478" y="276" text-anchor="middle" font-size="9.5" fill="#FFFFFF" font-weight="bold" font-style="normal">A5</text>
  <text x="498" y="266" text-anchor="start" font-size="10.5" fill="#6B7280" font-weight="normal" font-style="normal">Attended, no response. Record it</text>
<text x="498" y="280" text-anchor="start" font-size="10.5" fill="#6B7280" font-weight="normal" font-style="normal">and offer the next escalation</text>
<text x="498" y="294" text-anchor="start" font-size="10.5" fill="#6B7280" font-weight="normal" font-style="normal">step.</text>
  <line x1="466" y1="272" x2="434" y2="272" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="4 3"/>
