  <rect x="598" y="70" width="132" height="82" rx="10" fill="#DCFCE7" stroke="#2E7D46" stroke-width="2.2"/>
  <text x="664" y="100" text-anchor="middle" font-size="13.5" fill="#2E7D46" font-weight="bold" font-style="normal">Bound</text>
  <text x="664" y="122" text-anchor="middle" font-size="10" fill="#6B7280" font-weight="normal" font-style="normal">condition, metric,</text>
  <text x="664" y="137" text-anchor="middle" font-size="10" fill="#6B7280" font-weight="normal" font-style="normal">method, source</text>
