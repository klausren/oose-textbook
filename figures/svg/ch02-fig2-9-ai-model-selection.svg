<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 46 691 345" font-family="Arial">
  <defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs>
  <rect x="28" y="46" width="691" height="345" fill="#FFFFFF"/>
<rect x="45" y="118" width="146" height="112" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
  <text x="57" y="104" text-anchor="start" font-size="11.5" fill="#2563EB" font-weight="bold" font-style="normal">HUMAN</text>
  <text x="118" y="140" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">You state the</text>
  <text x="118" y="157" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">context</text>
  <text x="118" y="188" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">requirement clarity,</text>
<text x="118" y="204" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">volatility, team size,</text>
<text x="118" y="220" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">risk level</text>
  <rect x="215" y="118" width="146" height="112" rx="10" fill="#EDE7F6" stroke="#6D3FA8" stroke-width="2.2"/>
  <text x="227" y="104" text-anchor="start" font-size="11.5" fill="#6D3FA8" font-weight="bold" font-style="normal">AI</text>
  <text x="288" y="140" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">AI drafts</text>
  <text x="288" y="157" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">candidates</text>
  <text x="288" y="188" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">a comparison table and a</text>
<text x="288" y="204" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">recommendation, with</text>
<text x="288" y="220" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">[ASSUMPTION] flags</text>
  <rect x="385" y="118" width="146" height="112" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2"/>
  <text x="397" y="104" text-anchor="start" font-size="11.5" fill="#D97706" font-weight="bold" font-style="normal">CHECK</text>
  <text x="458" y="140" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">You cost the</text>
  <text x="458" y="157" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">ceremony</text>
  <text x="458" y="188" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">does the model exist,</text>
<text x="458" y="204" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">and can this team pay</text>
<text x="458" y="220" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">for its rituals</text>
  <rect x="555" y="118" width="146" height="112" rx="10" fill="#DCFCE7" stroke="#2E7D46" stroke-width="2.2"/>
  <text x="567" y="104" text-anchor="start" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">ARTEFACT</text>
  <text x="628" y="140" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">A choice you can</text>
  <text x="628" y="157" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">defend</text>
  <text x="628" y="188" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">the model, the reason,</text>
<text x="628" y="204" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">and what would change</text>
<text x="628" y="220" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">your mind</text>
  <line x1="191" y1="174" x2="211" y2="174" stroke="#1F2937" stroke-width="2.5" marker-end="url(#arrK)"/>
  <line x1="361" y1="174" x2="381" y2="174" stroke="#1F2937" stroke-width="2.5" marker-end="url(#arrK)"/>
  <line x1="531" y1="174" x2="551" y2="174" stroke="#1F2937" stroke-width="2.5" marker-end="url(#arrK)"/>
  <path d="M 458,116 L 458,78 L 288,78 L 288,112" fill="none" stroke="#6D3FA8" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrV)"/>
  <text x="373" y="70" text-anchor="middle" font-size="11.5" fill="#6D3FA8" font-weight="normal" font-style="italic">the recommendation rests on risk, not on reputation</text>
  <path d="M 458,230 L 458,268" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <rect x="340" y="272" width="236" height="56" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="458" y="294" text-anchor="middle" font-size="11.5" fill="#DC2626" font-weight="normal" font-style="normal">Use spiral — it is the most</text>
<text x="458" y="309" text-anchor="middle" font-size="11.5" fill="#DC2626" font-weight="normal" font-style="normal">thorough (for a six-person course</text>
<text x="458" y="324" text-anchor="middle" font-size="11.5" fill="#DC2626" font-weight="normal" font-style="normal">project)</text>
  <text x="380" y="372" text-anchor="middle" font-size="12.5" fill="#6B7280" font-weight="normal" font-style="normal">Match the model to the risk profile. Six students cannot pay for quarterly risk reviews.</text></svg>
