  <rect x="90" y="380" width="380" height="56" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
<text x="280.0" y="404" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">Wei rings the neighbour</text>
<text x="280.0" y="427" text-anchor="middle" font-size="10.5" fill="#2563EB" font-weight="normal" font-style="normal">13 min</text>
  <rect x="90" y="456" width="380" height="56" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
<text x="280.0" y="480" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">Neighbour crosses the corridor</text>
<text x="280.0" y="503" text-anchor="middle" font-size="10.5" fill="#2563EB" font-weight="normal" font-style="normal">9 min</text>
  <rect x="90" y="532" width="380" height="56" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
