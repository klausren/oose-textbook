<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Arial"><defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs><rect x="0" y="0" width="760" height="520" fill="#FFFFFF"/><text x="10" y="40" text-anchor="start" font-size="17" fill="#1F2937" font-weight="bold" font-style="normal">The CareLink change-request form</text><text x="10" y="62" text-anchor="start" font-size="12.5" fill="#6B7280" font-weight="normal" font-style="normal">Paper or tracker, the fields are the same — and the first two are the ones people skip</text><rect x="10" y="84" width="740" height="412" rx="10" fill="#FFFFFF" stroke="#C9D4E2" stroke-width="2"/><rect x="10" y="84" width="740" height="44" rx="10" fill="#1F2937"/><text x="26" y="112" text-anchor="start" font-size="14.5" fill="#FFFFFF" font-weight="bold" font-style="normal">Change request  ·  CareLink</text><text x="734" y="112" text-anchor="end" font-size="13" fill="#FFFFFF" font-weight="bold" font-style="normal">CR-004</text><text x="26" y="167" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold" font-style="normal">Raised by</text><rect x="196" y="146" width="540" height="34" rx="6" fill="#F5F6F7" stroke="#C9D4E2" stroke-width="1.6"/><text x="210" y="167" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Deng Wei, care co-ordinator</text><text x="26" y="205" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold" font-style="normal">Date raised</text><rect x="196" y="184" width="540" height="34" rx="6" fill="#F5F6F7" stroke="#C9D4E2" stroke-width="1.6"/><text x="210" y="205" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">2026-03-02</text><text x="26" y="248" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold" font-style="normal">What should change</text><rect x="196" y="222" width="540" height="44" rx="6" fill="#F5F6F7" stroke="#C9D4E2" stroke-width="1.6"/><text x="210" y="244" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">The alert must also notify the resident's named neighbour when</text><text x="210" y="259" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">nobody acknowledges it within ten minutes.</text><text x="26" y="296" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold" font-style="normal">Why now</text><rect x="196" y="270" width="540" height="44" rx="6" fill="#F5F6F7" stroke="#C9D4E2" stroke-width="1.6"/><text x="210" y="292" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Two no-acknowledgement incidents in February, both resolved by the</text><text x="210" y="307" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">neighbour after a phone call.</text><text x="26" y="339" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold" font-style="normal">Requirements touched</text><rect x="196" y="318" width="540" height="34" rx="6" fill="#F5F6F7" stroke="#C9D4E2" stroke-width="1.6"/><text x="210" y="339" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">R-053, R-055, and the extension in R-056</text><text x="26" y="377" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold" font-style="normal">Models touched</text><rect x="196" y="356" width="540" height="34" rx="6" fill="#F5F6F7" stroke="#C9D4E2" stroke-width="1.6"/><text x="210" y="377" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Alert state machine: one new state, two new transitions</text><text x="26" y="415" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold" font-style="normal">Requested by when</text><rect x="196" y="394" width="540" height="34" rx="6" fill="#F5F6F7" stroke="#C9D4E2" stroke-width="1.6"/><text x="210" y="415" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">before the April release</text><text x="26" y="453" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold" font-style="normal">Decision</text><rect x="196" y="432" width="540" height="34" rx="6" fill="#F5F6F7" stroke="#C9D4E2" stroke-width="1.6"/><text x="210" y="453" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">accepted ☑ deferred ☐ rejected ☐</text><text x="26" y="491" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold" font-style="normal">Decision by / on</text><rect x="196" y="470" width="540" height="34" rx="6" fill="#F5F6F7" stroke="#C9D4E2" stroke-width="1.6"/><text x="210" y="491" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">—</text><text x="26" y="506" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="italic">Fields 3 and 4 are the ones that get left blank. A change request without a reason cannot be assessed, only obeyed.</text></svg>