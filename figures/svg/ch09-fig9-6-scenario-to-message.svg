<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" font-family="Arial"><defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs><rect x="0" y="0" width="760" height="452" fill="#FFFFFF"/><text x="380" y="34" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold" font-style="normal">The sentence-to-message check, in both directions</text><rect x="18" y="56" width="724" height="122" rx="10" fill="#F6F9FF" stroke="#2563EB" stroke-width="2"/><text x="36" y="80" text-anchor="start" font-size="12" fill="#2563EB" font-weight="bold" font-style="normal">Direction 1 — sentence to message</text><text x="36" y="100" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Rule: every sentence that names a sender and a</text><text x="36" y="116" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">receiver must have a message.</text><text x="36" y="138" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">Result: this is where a missing requirement is found.</text><rect x="400" y="92" width="330" height="74" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8"/><text x="414" y="112" text-anchor="start" font-size="11.5" fill="#DC2626" font-weight="bold" font-style="normal">the sentence:</text><text x="414" y="130" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">"the phone shows not yet confirmed"</text><text x="414" y="150" text-anchor="start" font-size="11.5" fill="#DC2626" font-weight="normal" font-style="normal">no message  →  R-058</text><rect x="18" y="190" width="724" height="122" rx="10" fill="#F3FBFA" stroke="#0D9488" stroke-width="2"/><text x="36" y="214" text-anchor="start" font-size="12" fill="#0D9488" font-weight="bold" font-style="normal">Direction 2 — message to sentence</text><text x="36" y="234" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Rule: every message in the diagram must have</text><text x="36" y="250" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">a sentence in the scenario.</text><text x="36" y="272" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">Result: this is where design leaks into analysis.</text><rect x="400" y="226" width="330" height="74" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8"/><text x="414" y="246" text-anchor="start" font-size="11.5" fill="#DC2626" font-weight="bold" font-style="normal">the message:</text><text x="414" y="264" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">NotificationService.deliver()</text><text x="414" y="284" text-anchor="start" font-size="11.5" fill="#DC2626" font-weight="normal" font-style="normal">no sentence  →  removed</text><rect x="18" y="324" width="724" height="78" rx="10" fill="#F5F6F7" stroke="#C9D4E2" stroke-width="1.6"/><text x="36" y="350" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">The third result, and the quiet one</text><text x="36" y="372" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">"the system escalates" and "the system tells Deng" are one message and one guard.</text><text x="36" y="390" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">Keeping them as two arrows draws a decision as a message.</text><text x="380" y="430" text-anchor="middle" font-size="12" fill="#6B7280" font-weight="normal" font-style="italic">Two breaks, and only two: one sentence with no message, one message with no sentence.</text></svg>