<svg xmlns="http://www.w3.org/2000/svg" viewBox="23 29 714 492" font-family="Arial">
  <defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs>
  <rect x="23" y="29" width="714" height="492" fill="#FFFFFF"/>
<rect x="40" y="46" width="190" height="100" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.2"/>
  <text x="135" y="92" text-anchor="middle" font-size="15" fill="#DC2626" font-weight="bold" font-style="normal">Must</text>
  <text x="135" y="118" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">15 requirements</text>
  <rect x="250" y="46" width="470" height="100" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8"/>
  <text x="266" y="78" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">Release 1 fails without it. The test is the word “fails”, not</text>
<text x="266" y="95" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">the word “important”.</text>
  <text x="266" y="116" text-anchor="start" font-size="11.5" fill="#DC2626" font-weight="normal" font-style="normal">R-014 family notification within 60 s · R-021 escalation to the</text>
<text x="266" y="132" text-anchor="start" font-size="11.5" fill="#DC2626" font-weight="normal" font-style="normal">on-call nurse</text>
  <rect x="40" y="154" width="190" height="100" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2"/>
  <text x="135" y="200" text-anchor="middle" font-size="15" fill="#D97706" font-weight="bold" font-style="normal">Should</text>
  <text x="135" y="226" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">6 requirements</text>
  <rect x="250" y="154" width="470" height="100" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8"/>
  <text x="266" y="186" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">Painful to omit, and there is a workaround until release 2.</text>
  <text x="266" y="224" text-anchor="start" font-size="11.5" fill="#D97706" font-weight="normal" font-style="normal">R-033 weekly report to the family · R-036 reading history for 30</text>
<text x="266" y="240" text-anchor="start" font-size="11.5" fill="#D97706" font-weight="normal" font-style="normal">days</text>
  <rect x="40" y="262" width="190" height="100" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
  <text x="135" y="308" text-anchor="middle" font-size="15" fill="#2563EB" font-weight="bold" font-style="normal">Could</text>
  <text x="135" y="334" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">5 requirements</text>
  <rect x="250" y="262" width="470" height="100" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="266" y="294" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">Desirable, and the first thing the team drops when the release</text>
<text x="266" y="311" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">tightens.</text>
  <text x="266" y="332" text-anchor="start" font-size="11.5" fill="#2563EB" font-weight="normal" font-style="normal">R-045 export the last 30 days as CSV · R-047 dark theme</text>
  <rect x="40" y="370" width="190" height="100" rx="10" fill="#FAFAFA" stroke="#6B7280" stroke-width="2.2"/>
  <text x="135" y="416" text-anchor="middle" font-size="15" fill="#6B7280" font-weight="bold" font-style="normal">Won't (this time)</text>
  <text x="135" y="442" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">7 requirements</text>
  <rect x="250" y="370" width="470" height="100" rx="10" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.8"/>
  <text x="266" y="402" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">Explicitly out of scope, and published so that nobody assumes</text>
<text x="266" y="419" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">it.</text>
  <text x="266" y="440" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">R-050 video call · R-051 hospital EHR integration · R-052 medication</text>
<text x="266" y="456" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">reminders</text>
  <text x="380" y="502" text-anchor="middle" font-size="12.5" fill="#6B7280" font-weight="normal" font-style="italic">Must items should consume no more than about 60 % of the release's capacity.</text></svg>
