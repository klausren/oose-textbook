  <text x="380" y="272" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">41 raw candidates in, 26 checked requirements out.</text>
  <text x="380" y="291" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">Every merge, move, demotion and deletion is recorded with a named reason.</text></svg>
