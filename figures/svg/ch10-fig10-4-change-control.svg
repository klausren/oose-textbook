<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Arial"><defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs><rect x="0" y="0" width="760" height="470" fill="#FFFFFF"/><text x="10" y="40" text-anchor="start" font-size="17" fill="#1F2937" font-weight="bold" font-style="normal">Change control: from request to re-baseline</text><text x="10" y="62" text-anchor="start" font-size="12.5" fill="#6B7280" font-weight="normal" font-style="normal">Five steps, and the artefact each one leaves behind</text><rect x="10" y="90" width="214" height="52" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="24" y="112" text-anchor="start" font-size="13" fill="#2563EB" font-weight="bold" font-style="normal">1  Request</text><text x="24" y="129" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Anybody may raise one, in writing,</text><text x="24" y="143" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">on the form of figure 10-9.</text><line x1="232" y1="116" x2="268" y2="116" stroke="#6B7280" stroke-width="2.4" marker-end="url(#arrG)"/><rect x="280" y="90" width="470" height="52" rx="8" fill="#F5F6F7" stroke="#C9D4E2" stroke-width="1.6"/><text x="298" y="120" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">a numbered change request</text><rect x="10" y="154" width="214" height="52" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/><text x="24" y="176" text-anchor="start" font-size="13" fill="#0D9488" font-weight="bold" font-style="normal">2  Assess</text><text x="24" y="193" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Which requirements, use cases,</text><text x="24" y="207" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">model elements and tests are</text><text x="24" y="221" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">touched — and what that costs.</text><line x1="232" y1="180" x2="268" y2="180" stroke="#6B7280" stroke-width="2.4" marker-end="url(#arrG)"/><rect x="280" y="154" width="470" height="52" rx="8" fill="#F5F6F7" stroke="#C9D4E2" stroke-width="1.6"/><text x="298" y="184" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">an impact list</text><rect x="10" y="218" width="214" height="52" rx="8" fill="#DBEAFE" stroke="#D97706" stroke-width="2"/><text x="24" y="240" text-anchor="start" font-size="13" fill="#D97706" font-weight="bold" font-style="normal">3  Decide</text><text x="24" y="257" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">The customer accepts, defers or</text><text x="24" y="271" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">rejects. Acceptance is a decision</text><text x="24" y="285" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">with a date and a name.</text><line x1="232" y1="244" x2="268" y2="244" stroke="#6B7280" stroke-width="2.4" marker-end="url(#arrG)"/><rect x="280" y="218" width="470" height="52" rx="8" fill="#F5F6F7" stroke="#C9D4E2" stroke-width="1.6"/><text x="298" y="248" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">a recorded decision</text><rect x="10" y="282" width="214" height="52" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/><text x="24" y="304" text-anchor="start" font-size="13" fill="#DC2626" font-weight="bold" font-style="normal">4  Implement</text><text x="24" y="321" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">The specification, the models and</text><text x="24" y="335" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">the traceability matrix are</text><text x="24" y="349" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">updated together.</text><line x1="232" y1="308" x2="268" y2="308" stroke="#6B7280" stroke-width="2.4" marker-end="url(#arrG)"/><rect x="280" y="282" width="470" height="52" rx="8" fill="#F5F6F7" stroke="#C9D4E2" stroke-width="1.6"/><text x="298" y="312" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">a revised specification</text><rect x="10" y="346" width="214" height="52" rx="8" fill="#DBEAFE" stroke="#2E7D46" stroke-width="2"/><text x="24" y="368" text-anchor="start" font-size="13" fill="#2E7D46" font-weight="bold" font-style="normal">5  Re-baseline</text><text x="24" y="385" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">A new version number is issued,</text><text x="24" y="399" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">and the old one stays readable</text><text x="24" y="413" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">forever.</text><line x1="232" y1="372" x2="268" y2="372" stroke="#6B7280" stroke-width="2.4" marker-end="url(#arrG)"/><rect x="280" y="346" width="470" height="52" rx="8" fill="#F5F6F7" stroke="#C9D4E2" stroke-width="1.6"/><text x="298" y="376" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">a new baseline</text><text x="10" y="438" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold" font-style="normal">Steps 1 to 3 cost nothing but a meeting. Steps 4 and 5 are where the schedule moves.</text></svg>