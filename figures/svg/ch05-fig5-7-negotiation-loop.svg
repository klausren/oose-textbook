<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" font-family="Arial">
  <defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs>
  <rect x="0" y="0" width="760" height="312" fill="#FFFFFF"/>
<rect x="42" y="70" width="146" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
  <text x="115" y="100" text-anchor="middle" font-size="13.5" fill="#2563EB" font-weight="bold" font-style="normal">Identify</text>
  <text x="115" y="118" text-anchor="middle" font-size="9.5" fill="#6B7280" font-weight="normal" font-style="normal">both positions</text>
<text x="115" y="130" text-anchor="middle" font-size="9.5" fill="#6B7280" font-weight="normal" font-style="normal">written down</text>
  <text x="115" y="176" text-anchor="middle" font-size="10.5" fill="#6B7280" font-weight="normal" font-style="normal">a named conflict</text>
  <line x1="188" y1="108" x2="208" y2="108" stroke="#1F2937" stroke-width="2.4" marker-end="url(#arrK)"/>
  <rect x="212" y="70" width="146" height="76" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.2"/>
  <text x="285" y="100" text-anchor="middle" font-size="13.5" fill="#0D9488" font-weight="bold" font-style="normal">Discuss</text>
  <text x="285" y="118" text-anchor="middle" font-size="9.5" fill="#6B7280" font-weight="normal" font-style="normal">factual, goal or</text>
<text x="285" y="130" text-anchor="middle" font-size="9.5" fill="#6B7280" font-weight="normal" font-style="normal">resource?</text>
  <text x="285" y="176" text-anchor="middle" font-size="10.5" fill="#6B7280" font-weight="normal" font-style="normal">the kind of the</text>
<text x="285" y="190" text-anchor="middle" font-size="10.5" fill="#6B7280" font-weight="normal" font-style="normal">conflict</text>
  <line x1="358" y1="108" x2="378" y2="108" stroke="#1F2937" stroke-width="2.4" marker-end="url(#arrK)"/>
  <rect x="382" y="70" width="146" height="76" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2"/>
  <text x="455" y="100" text-anchor="middle" font-size="13.5" fill="#D97706" font-weight="bold" font-style="normal">Resolve</text>
  <text x="455" y="118" text-anchor="middle" font-size="9.5" fill="#6B7280" font-weight="normal" font-style="normal">the owner of the</text>
<text x="455" y="130" text-anchor="middle" font-size="9.5" fill="#6B7280" font-weight="normal" font-style="normal">value decides</text>
  <text x="455" y="176" text-anchor="middle" font-size="10.5" fill="#6B7280" font-weight="normal" font-style="normal">a decision, and a</text>
<text x="455" y="190" text-anchor="middle" font-size="10.5" fill="#6B7280" font-weight="normal" font-style="normal">decider</text>
  <line x1="528" y1="108" x2="548" y2="108" stroke="#1F2937" stroke-width="2.4" marker-end="url(#arrK)"/>
  <rect x="552" y="70" width="146" height="76" rx="10" fill="#DCFCE7" stroke="#2E7D46" stroke-width="2.2"/>
  <text x="625" y="100" text-anchor="middle" font-size="13.5" fill="#2E7D46" font-weight="bold" font-style="normal">Record</text>
  <text x="625" y="118" text-anchor="middle" font-size="9.5" fill="#6B7280" font-weight="normal" font-style="normal">four columns and a</text>
<text x="625" y="130" text-anchor="middle" font-size="9.5" fill="#6B7280" font-weight="normal" font-style="normal">date</text>
  <text x="625" y="176" text-anchor="middle" font-size="10.5" fill="#6B7280" font-weight="normal" font-style="normal">a disagreement log</text>
<text x="625" y="190" text-anchor="middle" font-size="10.5" fill="#6B7280" font-weight="normal" font-style="normal">row</text>
  <path d="M 690,146 L 690,224 L 24,224 L 24,108 L 36,108" fill="none" stroke="#2E7D46" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrGr)"/>
  <text x="370" y="246" text-anchor="middle" font-size="11.5" fill="#2E7D46" font-weight="normal" font-style="italic">an unresolved conflict returns to the table</text>
  <text x="380" y="292" text-anchor="middle" font-size="12.5" fill="#6B7280" font-weight="normal" font-style="italic">The loop exits only through Record. Skip it and the same conflict returns next week.</text></svg>
