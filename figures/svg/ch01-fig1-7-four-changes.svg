<svg xmlns="http://www.w3.org/2000/svg" viewBox="53 47 654 378" font-family="Arial">
  <defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs>
  <rect x="53" y="47" width="654" height="378" fill="#FFFFFF"/>
<text x="70" y="72" text-anchor="start" font-size="12" fill="#6B7280" font-weight="normal" font-style="normal">Typical maintenance effort by kind (schematic — proportions vary by system)</text>
  <rect x="70" y="88" width="124" height="66" rx="8" fill="#DC2626" stroke="#DC2626" stroke-width="2"/>
  <text x="132.0" y="130" text-anchor="middle" font-size="19" fill="#FFFFFF" font-weight="bold" font-style="normal">20%</text>
  <rect x="194" y="88" width="155" height="66" rx="8" fill="#D97706" stroke="#D97706" stroke-width="2"/>
  <text x="271.5" y="130" text-anchor="middle" font-size="19" fill="#FFFFFF" font-weight="bold" font-style="normal">25%</text>
  <rect x="349" y="88" width="248" height="66" rx="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
  <text x="473.0" y="130" text-anchor="middle" font-size="19" fill="#FFFFFF" font-weight="bold" font-style="normal">40%</text>
  <rect x="597" y="88" width="93" height="66" rx="8" fill="#0D9488" stroke="#0D9488" stroke-width="2"/>
  <text x="643.5" y="130" text-anchor="middle" font-size="19" fill="#FFFFFF" font-weight="bold" font-style="normal">15%</text>
  <rect x="70" y="190" width="145" height="34" rx="8" fill="#DC2626" stroke="#DC2626" stroke-width="2"/>
  <text x="142" y="212" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="bold" font-style="normal">Corrective</text>
  <text x="142" y="248" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">A defect surfaced. Repair</text>
<text x="142" y="263" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">what behaves wrongly.</text>
  <text x="142" y="320" text-anchor="middle" font-size="11.5" fill="#DC2626" font-weight="normal" font-style="normal">Example: the alert never</text>
<text x="142" y="335" text-anchor="middle" font-size="11.5" fill="#DC2626" font-weight="normal" font-style="normal">reaches the son.</text>
  <rect x="225" y="190" width="145" height="34" rx="8" fill="#D97706" stroke="#D97706" stroke-width="2"/>
  <text x="297" y="212" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="bold" font-style="normal">Adaptive</text>
  <text x="297" y="248" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">The environment moved.</text>
<text x="297" y="263" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">Adjust to a new platform,</text>
<text x="297" y="278" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">API or regulation.</text>
  <text x="297" y="320" text-anchor="middle" font-size="11.5" fill="#D97706" font-weight="normal" font-style="normal">Example: new rules on</text>
<text x="297" y="335" text-anchor="middle" font-size="11.5" fill="#D97706" font-weight="normal" font-style="normal">storing health data.</text>
  <rect x="380" y="190" width="145" height="34" rx="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
  <text x="452" y="212" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="bold" font-style="normal">Perfective</text>
  <text x="452" y="248" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">Nothing is broken. Make</text>
<text x="452" y="263" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">it faster, clearer or</text>
<text x="452" y="278" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">safer.</text>
  <text x="452" y="320" text-anchor="middle" font-size="11.5" fill="#2563EB" font-weight="normal" font-style="normal">Example: cut false alarms</text>
<text x="452" y="335" text-anchor="middle" font-size="11.5" fill="#2563EB" font-weight="normal" font-style="normal">by half.</text>
  <rect x="535" y="190" width="145" height="34" rx="8" fill="#0D9488" stroke="#0D9488" stroke-width="2"/>
  <text x="607" y="212" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="bold" font-style="normal">Preventive</text>
  <text x="607" y="248" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">Restructure now so that</text>
<text x="607" y="263" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">the next change is cheap.</text>
  <text x="607" y="320" text-anchor="middle" font-size="11.5" fill="#0D9488" font-weight="normal" font-style="normal">Example: abstract the</text>
<text x="607" y="335" text-anchor="middle" font-size="11.5" fill="#0D9488" font-weight="normal" font-style="normal">sensor layer first.</text>
  <text x="380" y="406" text-anchor="middle" font-size="12.5" fill="#6B7280" font-weight="normal" font-style="italic">More of the world's software budget goes to changing existing software than to building new software.</text></svg>
