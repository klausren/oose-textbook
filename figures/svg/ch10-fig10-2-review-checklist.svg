<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Arial"><defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs><rect x="0" y="0" width="760" height="440" fill="#FFFFFF"/><text x="10" y="40" text-anchor="start" font-size="17" fill="#1F2937" font-weight="bold" font-style="normal">A requirements review checklist</text><text x="10" y="62" text-anchor="start" font-size="12.5" fill="#6B7280" font-weight="normal" font-style="normal">Six criteria, each answered yes or no by a different reader</text><rect x="10" y="80" width="740" height="34" rx="6" fill="#1F2937"/><text x="20" y="102" text-anchor="start" font-size="12" fill="#FFFFFF" font-weight="bold" font-style="normal">Criterion</text><text x="116" y="102" text-anchor="start" font-size="12" fill="#FFFFFF" font-weight="bold" font-style="normal">The question the reader answers</text><text x="352" y="102" text-anchor="start" font-size="12" fill="#FFFFFF" font-weight="bold" font-style="normal">Pass condition</text><text x="668" y="102" text-anchor="start" font-size="12" fill="#FFFFFF" font-weight="bold" font-style="normal">Verdict</text><rect x="10" y="114" width="740" height="46" rx="4" fill="#F5F6F7" stroke="#C9D4E2" stroke-width="1.6"/><text x="20" y="142" text-anchor="start" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">1  Complete</text><text x="116" y="134" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">Is every path through the scenario covered,</text><text x="116" y="149" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">including the ones nobody mentioned?</text><text x="352" y="142" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Every extension named</text><circle cx="704" cy="137" r="12" fill="#FFFFFF" stroke="#C9D4E2" stroke-width="1.8"/><line x1="16" y1="114" x2="744" y2="114" stroke="#EDEFF2" stroke-width="1"/><line x1="16" y1="125.5" x2="744" y2="125.5" stroke="#EDEFF2" stroke-width="1"/><line x1="16" y1="137" x2="744" y2="137" stroke="#EDEFF2" stroke-width="1"/><line x1="16" y1="148.5" x2="744" y2="148.5" stroke="#EDEFF2" stroke-width="1"/><rect x="10" y="160" width="740" height="46" rx="4" fill="#FFFFFF" stroke="#C9D4E2" stroke-width="1.6"/><text x="20" y="188" text-anchor="start" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">2  Unambiguous</text><text x="116" y="180" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">Can two readers take two different meanings</text><text x="116" y="195" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">from this sentence?</text><text x="352" y="188" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">One reading only</text><circle cx="704" cy="183" r="12" fill="#FFFFFF" stroke="#C9D4E2" stroke-width="1.8"/><line x1="16" y1="160" x2="744" y2="160" stroke="#EDEFF2" stroke-width="1"/><line x1="16" y1="171.5" x2="744" y2="171.5" stroke="#EDEFF2" stroke-width="1"/><line x1="16" y1="183" x2="744" y2="183" stroke="#EDEFF2" stroke-width="1"/><line x1="16" y1="194.5" x2="744" y2="194.5" stroke="#EDEFF2" stroke-width="1"/><rect x="10" y="206" width="740" height="46" rx="4" fill="#F5F6F7" stroke="#C9D4E2" stroke-width="1.6"/><text x="20" y="234" text-anchor="start" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">3  Testable</text><text x="116" y="226" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">Can a tester write a pass/fail check from</text><text x="116" y="241" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">this sentence alone?</text><text x="352" y="234" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Criterion exists</text><circle cx="704" cy="229" r="12" fill="#FFFFFF" stroke="#C9D4E2" stroke-width="1.8"/><line x1="16" y1="206" x2="744" y2="206" stroke="#EDEFF2" stroke-width="1"/><line x1="16" y1="217.5" x2="744" y2="217.5" stroke="#EDEFF2" stroke-width="1"/><line x1="16" y1="229" x2="744" y2="229" stroke="#EDEFF2" stroke-width="1"/><line x1="16" y1="240.5" x2="744" y2="240.5" stroke="#EDEFF2" stroke-width="1"/><rect x="10" y="252" width="740" height="46" rx="4" fill="#FFFFFF" stroke="#C9D4E2" stroke-width="1.6"/><text x="20" y="280" text-anchor="start" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">4  Traceable</text><text x="116" y="272" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">Does it name the interview record it came</text><text x="116" y="287" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">from?</text><text x="352" y="280" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Source identified</text><circle cx="704" cy="275" r="12" fill="#FFFFFF" stroke="#C9D4E2" stroke-width="1.8"/><line x1="16" y1="252" x2="744" y2="252" stroke="#EDEFF2" stroke-width="1"/><line x1="16" y1="263.5" x2="744" y2="263.5" stroke="#EDEFF2" stroke-width="1"/><line x1="16" y1="275" x2="744" y2="275" stroke="#EDEFF2" stroke-width="1"/><line x1="16" y1="286.5" x2="744" y2="286.5" stroke="#EDEFF2" stroke-width="1"/><rect x="10" y="298" width="740" height="46" rx="4" fill="#F5F6F7" stroke="#C9D4E2" stroke-width="1.6"/><text x="20" y="326" text-anchor="start" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">5  Consistent</text><text x="116" y="318" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">Does it contradict anything else in the set?</text><text x="352" y="326" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">No contradiction</text><circle cx="704" cy="321" r="12" fill="#FFFFFF" stroke="#C9D4E2" stroke-width="1.8"/><line x1="16" y1="298" x2="744" y2="298" stroke="#EDEFF2" stroke-width="1"/><line x1="16" y1="309.5" x2="744" y2="309.5" stroke="#EDEFF2" stroke-width="1"/><line x1="16" y1="321" x2="744" y2="321" stroke="#EDEFF2" stroke-width="1"/><line x1="16" y1="332.5" x2="744" y2="332.5" stroke="#EDEFF2" stroke-width="1"/><rect x="10" y="344" width="740" height="46" rx="4" fill="#FFFFFF" stroke="#C9D4E2" stroke-width="1.6"/><text x="20" y="372" text-anchor="start" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">6  Bounded</text><text x="116" y="364" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">Does it say what is out of scope as well as</text><text x="116" y="379" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">in?</text><text x="352" y="372" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Won't list present</text><circle cx="704" cy="367" r="12" fill="#FFFFFF" stroke="#C9D4E2" stroke-width="1.8"/><line x1="16" y1="344" x2="744" y2="344" stroke="#EDEFF2" stroke-width="1"/><line x1="16" y1="355.5" x2="744" y2="355.5" stroke="#EDEFF2" stroke-width="1"/><line x1="16" y1="367" x2="744" y2="367" stroke="#EDEFF2" stroke-width="1"/><line x1="16" y1="378.5" x2="744" y2="378.5" stroke="#EDEFF2" stroke-width="1"/><text x="10" y="416" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold" font-style="normal">Two readers fill this in independently. Where they disagree, the requirement — not the reader — is wrong.</text></svg>