<svg xmlns="http://www.w3.org/2000/svg" viewBox="23 29 715 436" font-family="Arial">
  <defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs>
  <rect x="23" y="29" width="715" height="436" fill="#FFFFFF"/>
<rect x="40" y="46" width="320" height="320" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.2"/>
  <rect x="40" y="46" width="320" height="52" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.2"/>
  <text x="200" y="68" text-anchor="middle" font-size="15" fill="#DC2626" font-weight="bold" font-style="normal">Agile theatre</text>
  <text x="200" y="88" text-anchor="middle" font-size="11.5" fill="#DC2626" font-weight="normal" font-style="italic">the ceremonies, without the feedback</text>
  <circle cx="74" cy="134" r="9" fill="#DC2626"/><path d="M 70,130 l 8,8 M 78,130 l -8,8" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <text x="96" y="130.82" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">Stand-up is a status report to</text>
<text x="96" y="145.82" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">the teacher</text>
  <circle cx="74" cy="180" r="9" fill="#DC2626"/><path d="M 70,176 l 8,8 M 78,176 l -8,8" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <text x="96" y="184.32" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">Review shows slides, not software</text>
  <circle cx="74" cy="226" r="9" fill="#DC2626"/><path d="M 70,222 l 8,8 M 78,222 l -8,8" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <text x="96" y="230.32" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">Retrospective produces no change</text>
  <circle cx="74" cy="272" r="9" fill="#DC2626"/><path d="M 70,268 l 8,8 M 78,268 l -8,8" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <text x="96" y="276.32" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">Velocity reported, never used</text>
  <circle cx="74" cy="318" r="9" fill="#DC2626"/><path d="M 70,314 l 8,8 M 78,314 l -8,8" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <text x="96" y="322.32" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">Definition of Done unwritten</text>
  <rect x="400" y="46" width="320" height="320" rx="10" fill="#FFFFFF" stroke="#2E7D46" stroke-width="2.2"/>
  <rect x="400" y="46" width="320" height="52" rx="10" fill="#DCFCE7" stroke="#2E7D46" stroke-width="2.2"/>
  <text x="560" y="68" text-anchor="middle" font-size="15" fill="#2E7D46" font-weight="bold" font-style="normal">Real agility</text>
  <text x="560" y="88" text-anchor="middle" font-size="11.5" fill="#2E7D46" font-weight="normal" font-style="italic">inspect, then adapt — every time</text>
  <circle cx="434" cy="134" r="9" fill="#2E7D46"/><path d="M 430,134 l 3,3.5 l 5,-6.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <text x="456" y="130.82" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">Stand-up re-plans the day in 15</text>
<text x="456" y="145.82" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">minutes</text>
  <circle cx="434" cy="180" r="9" fill="#2E7D46"/><path d="M 430,180 l 3,3.5 l 5,-6.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <text x="456" y="176.82" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">Review demonstrates a working</text>
<text x="456" y="191.82" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">Increment</text>
  <circle cx="434" cy="226" r="9" fill="#2E7D46"/><path d="M 430,226 l 3,3.5 l 5,-6.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <text x="456" y="222.82" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">Retrospective changes one</text>
<text x="456" y="237.82" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">concrete thing</text>
  <circle cx="434" cy="272" r="9" fill="#2E7D46"/><path d="M 430,272 l 3,3.5 l 5,-6.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <text x="456" y="268.82" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">Velocity forecasts the next</text>
<text x="456" y="283.82" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">sprint</text>
  <circle cx="434" cy="318" r="9" fill="#2E7D46"/><path d="M 430,318 l 3,3.5 l 5,-6.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <text x="456" y="314.82" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">Definition of Done written and</text>
<text x="456" y="329.82" text-anchor="start" font-size="12" fill="#1F2937" font-weight="normal" font-style="normal">enforced</text>
  <rect x="40" y="392" width="680" height="56" rx="10" fill="#F5F6F7" stroke="#C9D4E2" stroke-width="2"/>
  <text x="380" y="414" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="normal" font-style="normal">Scrum, done properly, has more recurring inspection points than waterfall has.</text>
  <text x="380" y="434" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="normal" font-style="normal">Remove the inspection and what is left is a calendar of meetings.</text></svg>
