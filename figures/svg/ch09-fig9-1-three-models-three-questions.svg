eight="bold" font-style="normal">Sequence diagram</text><text x="30" y="91" text-anchor="start" font-size="11.5" fill="#2563EB" font-weight="bold" font-style="normal">Answers</text><text x="30" y="107" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">who talks to whom, in what order</text><line x1="19" y1="116" x2="253" y2="116" stroke="#E5EAF2" stroke-width="1.2"/><text x="30" y="129" text-anchor="start" font-size="11.5" fill="#2563EB" font-weight="bold" font-style="normal">Subject</text><text x="30" y="145" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">one scenario, start to finish</text><line x1="19" y1="154" x2="253" y2="154" stroke="#E5EAF2" stroke-width="1.2"/><text x="30" y="167" text-anchor="start" font-size="11.5" fill="#2563EB" font-weight="bold" font-style="normal">Vocabulary</text><text x="30" y="183" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">participant, lifeline, message,</text><text x="30" y="199" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">guarded branch</text><line x1="19" y1="208" x2="253" y2="208" stroke="#E5EAF2" stroke-width="1.2"/><text x="30" y="221" text-anchor="start" font-size="11.5" fill="#2563EB" font-weight="bold" font-style="normal">CareLink</text><text x="30" y="237" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">the alarm-escalation scenario</text><line x1="19" y1="246" x2="253" y2="246" stroke="#E5EAF2" stroke-width="1.2"/><text x="30" y="259" text-anchor="start" font-size="11.5" fill="#2563EB" font-weight="bold" font-style="normal">Finds</text><text x="30" y="275" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">a missing message; two failures</text><text x="30" y="291" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">that look identical</text><line x1="19" y1="300" x2="253" y2="300" stroke="#E5EAF2" stroke-width="1.2"/><text x="30" y="313" text-anchor="start" font-size="11.5" fill="#2563EB" font-weight="bold" font-style="normal">Cannot say</text><text x="30" y="329" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">whether the receiver is in a legal</text><text x="30" y="345" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">state</text><rect x="262" y="44" width="236" height="334" rx="10" fill="#FFFFFF" stroke="#6D3FA8" stroke-width="2"/><rect x="262" y="44" width="236" height="34" rx="10" fill="#EDE7F6"/><rect x="262" y="61" width="236" height="17" fill="#EDE7F6"/><text x="380" y="67" text-anchor="middle" font-size="12.5" fill="#6D3FA8" font-weight="bold" font-style="normal">State machine</text><text x="274" y="91" text-anchor="start" font-size="11.5" fill="#6D3FA8" font-weight="bold" font-style="normal">Answers</text><text x="274" y="107" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">what can happen to this one object</text><line x1="263" y1="116" x2="497" y2="116" stroke="#E5EAF2" stroke-width="1.2"/><text x="274" y="129" text-anchor="start" font-size="11.5" fill="#6D3FA8" font-weight="bold" font-style="normal">Subject</text><text x="274" y="145" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">one object, for its whole life</text><line x1="263" y1="154" x2="497" y2="154" stroke="#E5EAF2" stroke-width="1.2"/><text x="274" y="167" text-anchor="start" font-size="11.5" fill="#6D3FA8" font-weight="bold" font-style="normal">Vocabulary</text><text x="274" y="183" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">state, event, guard, action,</text><text x="274" y="199" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">transition</text><line x1="263" y1="208" x2="497" y2="208" stroke="#E5EAF2" stroke-width="1.2"/><text x="274" y="221" text-anchor="start" font-size="11.5" fill="#6D3FA8" font-weight="bold" font-style="normal">CareLink</text><text x="274" y="237" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">the Alert object</text><line x1="263" y1="246" x2="497" y2="246" stroke="#E5EAF2" stroke-width="1.2"/><text x="274" y="259" text-anchor="start" font-size="11.5" fill="#6D3FA8" font-weight="bold" font-style="normal">Finds</text><text x="274" y="275" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">a trap state; a cell nobody</text><text x="274" y="291" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">decided</text><line x1="263" y1="300" x2="497" y2="300" stroke="#E5EAF2" stroke-width="1.2"/><text x="274" y="313" text-anchor="start" font-size="11.5" fill="#6D3FA8" font-weight="bold" font-style="normal">Cannot say</text><text x="274" y="329" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">who sent the event, or how many</text><text x="274" y="345" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">participants</text><rect x="506" y="44" width="236" height="334" rx="10" fill="#FFFFFF" stroke="#2E7D46" stroke-width="2"/><rect x="506" y="44" width="236" height="34" rx="10" fill="#DCFCE7"/><rect x="506" y="61" width="236" height="17" fill="#DCFCE7"/><text x="624" y="67" text-anchor="middle" font-size="12.5" fill="#2E7D46" font-weight="bold" font-style="normal">Activity diagram</text><text x="518" y="91" text-anchor="start" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">Answers</text><text x="518" y="107" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">the workflow, and who does each</text><text x="518" y="123" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">step</text><line x1="507" y1="132" x2="741" y2="132" stroke="#E5EAF2" stroke-width="1.2"/><text x="518" y="145" text-anchor="start" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">Subject</text><text x="518" y="161" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">one workflow, across roles and the</text><text x="518" y="177" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">system</text><line x1="507" y1="186" x2="741" y2="186" stroke="#E5EAF2" stroke-width="1.2"/><text x="518" y="199" text-anchor="start" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">Vocabulary</text><text x="518" y="215" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">action, decision, merge, swimlane</text><line x1="507" y1="224" x2="741" y2="224" stroke="#E5EAF2" stroke-width="1.2"/><text x="518" y="237" text-anchor="start" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">CareLink</text><text x="518" y="253" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">the shift hand-over</text><line x1="507" y1="262" x2="741" y2="262" stroke="#E5EAF2" stroke-width="1.2"/><text x="518" y="275" text-anchor="start" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">Finds</text><text x="518" y="291" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">an unowned step; a hand-over that</text><text x="518" y="307" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">loses work</text><line x1="507" y1="316" x2="741" y2="316" stroke="#E5EAF2" stroke-width="1.2"/><text x="518" y="329" text-anchor="start" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">Cannot say</text><text x="518" y="345" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">the order of messages inside one</text><text x="518" y="361" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">step</text></svg>