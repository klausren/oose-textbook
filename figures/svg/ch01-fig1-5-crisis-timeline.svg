  <text x="100" y="74" text-anchor="middle" font-size="13.5" fill="#D97706" font-weight="bold" font-style="normal">1968</text>
  <text x="100" y="94" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">NATO conference</text>
  <text x="100" y="109" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">names the software</text>
  <text x="100" y="124" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">crisis</text>
  <circle cx="100" cy="200" r="6" fill="#D97706"/>
  <line x1="240" y1="200" x2="240" y2="246" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrK)"/>
  <rect x="178" y="252" width="124" height="104" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="240" y="278" text-anchor="middle" font-size="13.5" fill="#2563EB" font-weight="bold" font-style="normal">1970s</text>
  <text x="240" y="300" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">Structured methods:</text>
<text x="240" y="315" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">waterfall and</text>
<text x="240" y="330" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">structured analysis</text>
