  <line x1="466" y1="372" x2="434" y2="372" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="380" y="452" text-anchor="middle" font-size="12" fill="#6B7280" font-weight="normal" font-style="normal">The wireframe is the prop. The alternative flows it exposes are the finding.</text></svg>
