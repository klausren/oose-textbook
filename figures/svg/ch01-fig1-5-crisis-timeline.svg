  <rect x="458" y="252" width="124" height="104" rx="10" fill="#FFFFFF" stroke="#2E7D46" stroke-width="2"/>
  <text x="520" y="278" text-anchor="middle" font-size="13.5" fill="#2E7D46" font-weight="bold" font-style="normal">2001</text>
  <text x="520" y="300" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">Agile Manifesto:</text>
<text x="520" y="315" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">change is welcomed,</text>
<text x="520" y="330" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">not managed away</text>
  <circle cx="520" cy="200" r="6" fill="#2E7D46"/>
  <line x1="660" y1="154" x2="660" y2="194" stroke="#6D3FA8" stroke-width="2.5" marker-end="url(#arrK)"/>
  <rect x="598" y="48" width="124" height="104" rx="10" fill="#FFFFFF" stroke="#6D3FA8" stroke-width="2"/>
  <text x="660" y="74" text-anchor="middle" font-size="13.5" fill="#6D3FA8" font-weight="bold" font-style="normal">2020s</text>
  <text x="660" y="96" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">AI-assisted</text>
<text x="660" y="111" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">engineering: cheaper</text>
<text x="660" y="126" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">artefacts, same</text>
