t-style="normal">The walk in the other direction</text><text x="34" y="448" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">· Address is mentioned by two use cases and maintained by none — the key-box code lived in a spreadsheet.</text><text x="34" y="466" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">· Care assignment is implied by Log a visit and stated by no use case — new requirement R-057.</text><text x="380" y="528" text-anchor="middle" font-size="12" fill="#6B7280" font-weight="normal" font-style="italic">Every concept needs at least one goal that maintains it, or a reason on the record.</text></svg>