  <text x="170" y="130" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">Falls; pendant</text>
  <text x="170" y="143" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">dials the centre</text>
  <circle cx="278" cy="188" r="9" fill="#0D9488"/><text x="278" y="192.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold" font-style="normal">2</text>
  <text x="278" y="214" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">Rings the landline</text>
  <text x="278" y="227" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">three times</text>
  <circle cx="386" cy="188" r="9" fill="#0D9488"/><text x="386" y="192.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold" font-style="normal">3</text>
  <text x="386" y="214" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">Wei returns</text>
  <text x="386" y="227" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">the call</text>
  <circle cx="494" cy="272" r="9" fill="#D97706"/><text x="494" y="276.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold" font-style="normal">4</text>
  <text x="494" y="298" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">Wei rings the</text>
  <text x="494" y="311" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">neighbour</text>
  <circle cx="602" cy="272" r="9" fill="#D97706"/><text x="602" y="276.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold" font-style="normal">5</text>
  <text x="602" y="298" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">Neighbour crosses,</text>
  <text x="602" y="311" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">finds her</text>
  <circle cx="698" cy="356" r="9" fill="#2E7D46"/><text x="698" y="360.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold" font-style="normal">6</text>
  <text x="698" y="382" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">Dispatch, then a</text>
  <text x="698" y="395" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">45-min drive</text>
  <text x="380" y="424" text-anchor="middle" font-size="12" fill="#6B7280" font-weight="normal" font-style="italic">Arrow crossings are handoffs. Four of the six actors sit outside the care centre's authority.</text></svg>
