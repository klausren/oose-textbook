<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Arial">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <!-- Layered technology stack (bottom-up: quality focus -&gt; process -&gt; methods -&gt; tools) -->
  <rect x="250" y="30" width="260" height="62" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="380" y="56" text-anchor="middle" font-size="19" font-weight="bold" fill="#1F2937">Tools</text>
  <text x="380" y="78" text-anchor="middle" font-size="14" fill="#6B7280">automation · IDE · Git · CI</text>

  <rect x="250" y="110" width="260" height="62" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5"/>
  <text x="380" y="136" text-anchor="middle" font-size="19" font-weight="bold" fill="#1F2937">Methods</text>
  <text x="380" y="158" text-anchor="middle" font-size="14" fill="#6B7280">how-to · elicitation · design · testing</text>

  <rect x="250" y="190" width="260" height="72" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="380" y="216" text-anchor="middle" font-size="19" font-weight="bold" fill="#1F2937">Process</text>
  <text x="380" y="238" text-anchor="middle" font-size="14" fill="#6B7280">framework activities + umbrella activities</text>

  <polygon points="230,286 530,286 560,338 200,338" fill="#E5E7EB" stroke="#6B7280" stroke-width="2.5"/>
  <text x="380" y="318" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">A quality focus</text>

  <!-- side annotations -->
  <text x="540" y="66" font-size="15" font-style="italic" fill="#6B7280">tools do it faster</text>
  <text x="540" y="146" font-size="15" font-style="italic" fill="#6B7280">methods say how</text>
  <text x="540" y="226" font-size="15" font-style="italic" fill="#6B7280">process says when</text>
  <text x="540" y="318" font-size="15" font-style="italic" fill="#6B7280">the bedrock of every layer</text>

  <!-- load arrows between layers -->
  <defs>
    <marker id="dn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#94A3B8"/>
    </marker>
  </defs>
  <line x1="380" y1="96" x2="380" y2="106" stroke="#94A3B8" stroke-width="2" marker-end="url(#dn)"/>
  <line x1="380" y1="176" x2="380" y2="186" stroke="#94A3B8" stroke-width="2" marker-end="url(#dn)"/>
  <line x1="380" y1="266" x2="380" y2="282" stroke="#94A3B8" stroke-width="2" marker-end="url(#dn)"/>
</svg>
