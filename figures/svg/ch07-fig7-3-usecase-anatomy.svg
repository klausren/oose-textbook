<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 508" font-family="Arial">
  <defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs>
  <rect x="0" y="0" width="760" height="508" fill="#FFFFFF"/>
<text x="30" y="40" text-anchor="start" font-size="11" fill="#6B7280" font-weight="bold" font-style="normal">Element</text>
  <text x="200" y="40" text-anchor="start" font-size="11" fill="#6B7280" font-weight="bold" font-style="normal">Notation and commitment</text>
  <line x1="30" y1="50" x2="730" y2="50" stroke="#C9D4E2" stroke-width="1.6"/>
  <circle cx="62" cy="86" r="6" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.8"/>
  <line x1="62" y1="92" x2="62" y2="104" stroke="#1F2937" stroke-width="1.8"/>
  <line x1="53" y1="97" x2="71" y2="97" stroke="#1F2937" stroke-width="1.8"/>
  <line x1="62" y1="104" x2="55" y2="115" stroke="#1F2937" stroke-width="1.8"/>
  <line x1="62" y1="104" x2="69" y2="115" stroke="#1F2937" stroke-width="1.8"/>
  <text x="200" y="98" text-anchor="start" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">Actor</text>
  <text x="200" y="117" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">A role outside the boundary — never a person, never a department</text>
  <line x1="30" y1="118" x2="730" y2="118" stroke="#C9D4E2" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="56" cy="156" r="5" fill="#1F2937"/>
  <line x1="64" y1="156" x2="116" y2="156" stroke="#1F2937" stroke-width="2"/>
  <circle cx="124" cy="156" r="5" fill="#1F2937"/>
  <text x="200" y="154" text-anchor="start" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">Association</text>
  <text x="200" y="173" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">This actor pursues this goal</text>
  <line x1="30" y1="174" x2="730" y2="174" stroke="#C9D4E2" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="40" y="196" width="100" height="32" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="90" y="216" text-anchor="middle" font-size="10" fill="#2563EB" font-weight="normal" font-style="normal">CareLink</text>
  <text x="200" y="210" text-anchor="start" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">System boundary</text>
  <text x="200" y="229" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">What the project is responsible for</text>
  <line x1="30" y1="230" x2="730" y2="230" stroke="#C9D4E2" stroke-width="1" stroke-dasharray="3 4"/>
  <ellipse cx="90" cy="268" rx="50" ry="17" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="90" y="271.6" text-anchor="middle" font-size="9.5" fill="#1F2937" font-weight="normal" font-style="normal">Confirm safety</text>
  <text x="200" y="266" text-anchor="start" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">Use case</text>
  <text x="200" y="285" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">A goal at user-goal level</text>
  <line x1="30" y1="286" x2="730" y2="286" stroke="#C9D4E2" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="44" y1="324" x2="124" y2="324" stroke="#D97706" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
  <text x="84" y="316" text-anchor="middle" font-size="10" fill="#D97706" font-weight="normal" font-style="normal">«include»</text>
  <text x="200" y="322" text-anchor="start" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">Include</text>
  <text x="200" y="341" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">The target always runs as part of the base case</text>
  <line x1="30" y1="342" x2="730" y2="342" stroke="#C9D4E2" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="44" y1="380" x2="124" y2="380" stroke="#0D9488" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrT)"/>
  <text x="84" y="372" text-anchor="middle" font-size="10" fill="#0D9488" font-weight="normal" font-style="normal">«extend»</text>
  <text x="200" y="378" text-anchor="start" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">Extend</text>
  <text x="200" y="397" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">Runs only under a condition; the base is complete without it</text>
  <line x1="30" y1="398" x2="730" y2="398" stroke="#C9D4E2" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="44" y1="436" x2="120" y2="436" stroke="#2E7D46" stroke-width="2.4"/>
  <polygon points="120,428 134,436 120,444" fill="#FFFFFF" stroke="#2E7D46" stroke-width="1.6"/>
  <text x="200" y="434" text-anchor="start" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">Generalisation</text>
  <text x="200" y="453" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">The source is a specialisation of the target</text>
  <line x1="30" y1="454" x2="730" y2="454" stroke="#C9D4E2" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="380" y="480" text-anchor="middle" font-size="12" fill="#6B7280" font-weight="normal" font-style="normal">No arrows between use cases except the three dashed and hollow-headed ones above. One goal</text>
<text x="380" y="497" text-anchor="middle" font-size="12" fill="#6B7280" font-weight="normal" font-style="normal">per oval.</text></svg>
