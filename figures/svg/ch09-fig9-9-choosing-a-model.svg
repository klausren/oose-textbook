<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Arial"><defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs><rect x="0" y="0" width="760" height="470" fill="#FFFFFF"/><text x="380" y="32" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold" font-style="normal">Four questions, asked in this order</text><rect x="18" y="66" width="440" height="60" rx="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="30" y="82" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Does it name one object, and what becomes of it</text><text x="30" y="98" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">over time?</text><text x="30" y="116" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="italic">e.g. “What happens to an alert between 02:31 and 02:41?”</text><line x1="458" y1="96" x2="500" y2="96" stroke="#1F2937" stroke-width="2.2" marker-end="url(#arrK)"/><text x="479" y="90" text-anchor="middle" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">yes</text><rect x="500" y="72" width="242" height="48" rx="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="621" y="94" text-anchor="middle" font-size="11.5" fill="#2563EB" font-weight="bold" font-style="normal">state machine</text><text x="621" y="112" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">one object, its whole life</text><line x1="238" y1="126" x2="238" y2="146" stroke="#1F2937" stroke-width="2.2" marker-end="url(#arrK)"/><text x="248" y="141" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="bold" font-style="normal">no</text><rect x="18" y="146" width="440" height="60" rx="9" fill="#FFFFFF" stroke="#6D3FA8" stroke-width="2"/><text x="30" y="162" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Does it name the order of messages between</text><text x="30" y="178" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">named participants?</text><text x="30" y="196" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="italic">e.g. “Who tells whom, and in what order?”</text><line x1="458" y1="176" x2="500" y2="176" stroke="#1F2937" stroke-width="2.2" marker-end="url(#arrK)"/><text x="479" y="170" text-anchor="middle" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">yes</text><rect x="500" y="152" width="242" height="48" rx="9" fill="#FFFFFF" stroke="#6D3FA8" stroke-width="2"/><text x="621" y="174" text-anchor="middle" font-size="11.5" fill="#6D3FA8" font-weight="bold" font-style="normal">sequence diagram</text><text x="621" y="192" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">who talks to whom, in order</text><line x1="238" y1="206" x2="238" y2="226" stroke="#1F2937" stroke-width="2.2" marker-end="url(#arrK)"/><text x="248" y="221" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="bold" font-style="normal">no</text><rect x="18" y="226" width="440" height="60" rx="9" fill="#FFFFFF" stroke="#2E7D46" stroke-width="2"/><text x="30" y="242" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Does it name a workflow with steps, decisions</text><text x="30" y="258" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">and hand-offs?</text><text x="30" y="276" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="italic">e.g. “What happens when the shift changes?”</text><line x1="458" y1="256" x2="500" y2="256" stroke="#1F2937" stroke-width="2.2" marker-end="url(#arrK)"/><text x="479" y="250" text-anchor="middle" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">yes</text><rect x="500" y="232" width="242" height="48" rx="9" fill="#FFFFFF" stroke="#2E7D46" stroke-width="2"/><text x="621" y="254" text-anchor="middle" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">activity diagram</text><text x="621" y="272" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">one workflow, across roles</text><line x1="238" y1="286" x2="238" y2="306" stroke="#1F2937" stroke-width="2.2" marker-end="url(#arrK)"/><text x="248" y="301" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="bold" font-style="normal">no</text><rect x="18" y="306" width="440" height="60" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/><text x="30" y="322" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">None of the three?</text><text x="30" y="338" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Then it is a data question, a goal question, or a</text><text x="30" y="356" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="italic">process question. Do not force it.</text><line x1="458" y1="336" x2="500" y2="336" stroke="#1F2937" stroke-width="2.2" marker-end="url(#arrK)"/><text x="479" y="330" text-anchor="middle" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">yes</text><rect x="500" y="312" width="242" height="48" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/><text x="621" y="334" text-anchor="middle" font-size="11.5" fill="#D97706" font-weight="bold" font-style="normal">a different chapter</text><text x="621" y="352" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">data, goal or process</text><rect x="18" y="384" width="724" height="66" rx="10" fill="#F5F6F7" stroke="#C9D4E2" stroke-width="1.6"/><text x="32" y="408" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">Do not draw a model because the notation exists.</text><text x="32" y="428" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">Its real cost is that it must now agree with the other models, in every review, for the rest of the project.</text></svg>