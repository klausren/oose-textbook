  <text x="600" y="326" text-anchor="middle" font-size="12.5" fill="#DC2626" font-weight="bold" font-style="normal">cycle 112 min</text>
  <text x="600" y="348" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="normal" font-style="normal">touch 21</text>
  <text x="600" y="366" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="normal" font-style="normal">waiting 46</text>
  <text x="600" y="384" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="normal" font-style="normal">travel 45</text>
  <text x="600" y="440" text-anchor="middle" font-size="11" fill="#6B7280" font-weight="normal" font-style="normal">Four of the six actors sit</text>
<text x="600" y="456" text-anchor="middle" font-size="11" fill="#6B7280" font-weight="normal" font-style="normal">outside the care centre's</text>
<text x="600" y="472" text-anchor="middle" font-size="11" fill="#6B7280" font-weight="normal" font-style="normal">authority.</text></svg>
