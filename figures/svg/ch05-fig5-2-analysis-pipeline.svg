  <rect x="314" y="70" width="132" height="82" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2"/>
  <text x="380" y="100" text-anchor="middle" font-size="13.5" fill="#D97706" font-weight="bold" font-style="normal">Resolve</text>
  <text x="380" y="122" text-anchor="middle" font-size="10" fill="#6B7280" font-weight="normal" font-style="normal">name the conflict,</text>
  <text x="380" y="137" text-anchor="middle" font-size="10" fill="#6B7280" font-weight="normal" font-style="normal">find its owner</text>
  <text x="380" y="186" text-anchor="middle" font-size="11" fill="#D97706" font-weight="normal" font-style="normal">a decision and a</text>
<text x="380" y="201" text-anchor="middle" font-size="11" fill="#D97706" font-weight="normal" font-style="normal">decider</text>
  <line x1="446" y1="111" x2="454" y2="111" stroke="#1F2937" stroke-width="2.4" marker-end="url(#arrK)"/>
  <rect x="456" y="70" width="132" height="82" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.2"/>
  <text x="522" y="100" text-anchor="middle" font-size="13.5" fill="#DC2626" font-weight="bold" font-style="normal">Prioritise</text>
  <text x="522" y="122" text-anchor="middle" font-size="10" fill="#6B7280" font-weight="normal" font-style="normal">Must, Should, Could,</text>
  <text x="522" y="137" text-anchor="middle" font-size="10" fill="#6B7280" font-weight="normal" font-style="normal">Won't</text>
  <text x="522" y="186" text-anchor="middle" font-size="11" fill="#DC2626" font-weight="normal" font-style="normal">a published Won't</text>
<text x="522" y="201" text-anchor="middle" font-size="11" fill="#DC2626" font-weight="normal" font-style="normal">list</text>
