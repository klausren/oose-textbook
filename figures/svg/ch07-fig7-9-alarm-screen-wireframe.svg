  <text x="478" y="116" text-anchor="middle" font-size="9.5" fill="#FFFFFF" font-weight="bold" font-style="normal">A1</text>
  <text x="498" y="106" text-anchor="start" font-size="10.5" fill="#6B7280" font-weight="normal" font-style="normal">No coverage at the tap. The button</text>
