<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 9 748 351" font-family="Arial"><defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs><rect x="6" y="9" width="748" height="351" fill="#FFFFFF"/><text x="380" y="38" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold" font-style="normal">AI-assisted concept extraction, with verification</text><rect x="23" y="76" width="165" height="152" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2"/><rect x="23" y="76" width="165" height="56" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/><text x="105.5" y="100" text-anchor="middle" font-size="12.5" fill="#2563EB" font-weight="bold" font-style="normal">1</text><text x="105.5" y="122" text-anchor="middle" font-size="12" fill="#2563EB" font-weight="bold" font-style="normal">Human supplies</text><text x="36" y="156" text-anchor="start" font-size="11.5" fill="#2563EB" font-weight="bold" font-style="normal">YOU SUPPLY</text><text x="36" y="176" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Four transcripts,</text><text x="36" y="191" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">eleven thousand words</text><text x="36" y="206" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">of interview.</text><rect x="206" y="76" width="165" height="152" rx="10" fill="#FFFFFF" stroke="#6D3FA8" stroke-width="2.2"/><rect x="206" y="76" width="165" height="56" rx="10" fill="#EDE7F6" stroke="#6D3FA8" stroke-width="2.2"/><text x="288.5" y="100" text-anchor="middle" font-size="12.5" fill="#6D3FA8" font-weight="bold" font-style="normal">2</text><text x="288.5" y="122" text-anchor="middle" font-size="12" fill="#6D3FA8" font-weight="bold" font-style="normal">AI lists</text><text x="219" y="156" text-anchor="start" font-size="11.5" fill="#6D3FA8" font-weight="bold" font-style="normal">AI RETURNS</text><text x="219" y="176" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">51 candidate</text><text x="219" y="191" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">concepts, each with</text><text x="219" y="206" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">a definition.</text><rect x="389" y="76" width="165" height="152" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2.2"/><rect x="389" y="76" width="165" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2"/><text x="471.5" y="100" text-anchor="middle" font-size="12.5" fill="#D97706" font-weight="bold" font-style="normal">3</text><text x="471.5" y="122" text-anchor="middle" font-size="12" fill="#D97706" font-weight="bold" font-style="normal">Human verifies</text><text x="402" y="156" text-anchor="start" font-size="11.5" fill="#D97706" font-weight="bold" font-style="normal">YOU CHECK</text><text x="402" y="176" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Three tests, the</text><text x="402" y="191" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">boundary, and the</text><text x="402" y="206" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">evidence tag.</text><rect x="572" y="76" width="165" height="152" rx="10" fill="#FFFFFF" stroke="#2E7D46" stroke-width="2.2"/><rect x="572" y="76" width="165" height="56" rx="10" fill="#DCFCE7" stroke="#2E7D46" stroke-width="2.2"/><text x="654.5" y="100" text-anchor="middle" font-size="12.5" fill="#2E7D46" font-weight="bold" font-style="normal">4</text><text x="654.5" y="122" text-anchor="middle" font-size="12" fill="#2E7D46" font-weight="bold" font-style="normal">Artifact</text><text x="585" y="156" text-anchor="start" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">YOU PRODUCE</text><text x="585" y="176" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">16 concepts, each</text><text x="585" y="191" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">with a source line</text><text x="585" y="206" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">it can be traced to.</text><line x1="191" y1="152" x2="203" y2="152" stroke="#1F2937" stroke-width="2.4" marker-end="url(#arrK)"/><line x1="374" y1="152" x2="386" y2="152" stroke="#1F2937" stroke-width="2.4" marker-end="url(#arrK)"/><line x1="557" y1="152" x2="569" y2="152" stroke="#1F2937" stroke-width="2.4" marker-end="url(#arrK)"/><line x1="471.5" y1="228" x2="471.5" y2="250" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arrR)"/><rect x="389" y="252" width="165" height="58" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="401" y="274" text-anchor="start" font-size="11.5" fill="#DC2626" font-weight="bold" font-style="normal">reject: no source line</text><text x="401" y="292" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">delete, or log a question</text><text x="480" y="246" text-anchor="start" font-size="11.5" fill="#DC2626" font-weight="normal" font-style="normal">any line without a tag</text><text x="380" y="344" text-anchor="middle" font-size="12" fill="#6B7280" font-weight="normal" font-style="italic">The extraction is the assistant's. The three tests, the boundary and the evidence tag are yours.</text></svg>