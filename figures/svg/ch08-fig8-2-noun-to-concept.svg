<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 12 755 443" font-family="Arial"><defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs><rect x="3" y="12" width="755" height="443" fill="#FFFFFF"/><text x="380" y="38" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold" font-style="normal">Finding concepts: nouns, then discard, then name</text><rect x="20" y="64" width="160" height="320" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2"/><rect x="20" y="64" width="160" height="52" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/><text x="100" y="90" text-anchor="middle" font-size="12.5" fill="#2563EB" font-weight="bold" font-style="normal">1 · Collect</text><text x="100" y="107" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">from the sources</text><text x="32" y="140" text-anchor="start" font-size="12.5" fill="#2563EB" font-weight="bold" font-style="normal">54 candidate</text><text x="32" y="160" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">noun phrases</text><text x="32" y="176" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">from nine sources</text><text x="32" y="210" text-anchor="start" font-size="11.5" fill="#2563EB" font-weight="bold" font-style="normal">One pass.</text><text x="32" y="226" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">No editing.</text><text x="32" y="260" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">A source tag on</text><text x="32" y="276" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">every card, before</text><text x="32" y="292" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">it is sorted.</text><text x="32" y="326" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">Five minutes of</text><text x="32" y="342" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">tags beats an</text><text x="32" y="358" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">hour of argument.</text><rect x="206" y="64" width="300" height="320" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2"/><rect x="206" y="64" width="300" height="52" rx="10" fill="#F5F6F7" stroke="#1F2937" stroke-width="2.2"/><text x="356" y="90" text-anchor="middle" font-size="12.5" fill="#1F2937" font-weight="bold" font-style="normal">2 · Discard</text><text x="356" y="107" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">the ledger, by family</text><rect x="222" y="141" width="12" height="12" rx="2" fill="#6B7280"/><text x="244" y="150" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">synonyms · merged into one word</text><text x="496" y="150" text-anchor="end" font-size="12.5" fill="#6B7280" font-weight="bold" font-style="normal">12</text><rect x="222" y="187" width="12" height="12" rx="2" fill="#D97706"/><text x="244" y="196" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">attributes · demoted to a field</text><text x="496" y="196" text-anchor="end" font-size="12.5" fill="#D97706" font-weight="bold" font-style="normal">9</text><rect x="222" y="233" width="12" height="12" rx="2" fill="#2563EB"/><text x="244" y="242" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">outside the boundary · recorded</text><text x="496" y="242" text-anchor="end" font-size="12.5" fill="#2563EB" font-weight="bold" font-style="normal">5</text><rect x="222" y="279" width="12" height="12" rx="2" fill="#DC2626"/><text x="244" y="288" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">no evidence · deleted</text><text x="496" y="288" text-anchor="end" font-size="12.5" fill="#DC2626" font-weight="bold" font-style="normal">8</text><rect x="222" y="325" width="12" height="12" rx="2" fill="#DC2626"/><text x="244" y="334" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">the solution · removed</text><text x="496" y="334" text-anchor="end" font-size="12.5" fill="#DC2626" font-weight="bold" font-style="normal">4</text><text x="356" y="364" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="italic">The ledger is a deliverable.</text><rect x="532" y="64" width="208" height="320" rx="10" fill="#FFFFFF" stroke="#2E7D46" stroke-width="2.2"/><rect x="532" y="64" width="208" height="52" rx="10" fill="#DCFCE7" stroke="#2E7D46" stroke-width="2.2"/><text x="636" y="90" text-anchor="middle" font-size="12.5" fill="#2E7D46" font-weight="bold" font-style="normal">3 · Name</text><text x="636" y="107" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">what survives</text><text x="544" y="140" text-anchor="start" font-size="12.5" fill="#2E7D46" font-weight="bold" font-style="normal">16 concepts</text><text x="544" y="160" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">kept</text><text x="544" y="194" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">A singular noun</text><text x="544" y="210" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">in the users' words</text><text x="544" y="244" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">One word per</text><text x="544" y="260" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">concept, everywhere</text><text x="544" y="294" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">No Manager, Info,</text><text x="544" y="310" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Data or Service</text><text x="544" y="344" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">Question the noun,</text><text x="544" y="360" text-anchor="start" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">not the source.</text><line x1="182" y1="224" x2="200" y2="224" stroke="#1F2937" stroke-width="2.4" marker-end="url(#arrK)"/><line x1="508" y1="224" x2="526" y2="224" stroke="#1F2937" stroke-width="2.4" marker-end="url(#arrK)"/><text x="380" y="436" text-anchor="middle" font-size="12" fill="#6B7280" font-weight="normal" font-style="italic">Extraction is mechanical. Reduction is the analysis, and the ledger is what a reviewer can check.</text></svg>