<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Arial">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="dn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#94A3B8"/>
    </marker>
  </defs>
  <!-- Layered technology stack (bottom-up: quality focus -> process -> methods -> tools) -->
  <rect x="250" y="30" width="260" height="62" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="380" y="56" text-anchor="middle" font-size="19" font-weight="bold" fill="#1F2937">Tools</text>
  <text x="380" y="78" text-anchor="middle" font-size="14" fill="#6B7280">automation · IDE · Git · CI</text>

  <line x1="380" y1="96" x2="380" y2="120" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#dn)"/>

  <rect x="250" y="128" width="260" height="62" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5"/>
  <text x="380" y="154" text-anchor="middle" font-size="19" font-weight="bold" fill="#1F2937">Methods</text>
  <text x="380" y="176" text-anchor="middle" font-size="14" fill="#6B7280">how-to · elicitation · design · testing</text>

  <line x1="380" y1="194" x2="380" y2="218" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#dn)"/>

  <rect x="250" y="226" width="260" height="72" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="380" y="252" text-anchor="middle" font-size="19" font-weight="bold" fill="#1F2937">Process</text>
  <text x="380" y="274" text-anchor="middle" font-size="14" fill="#6B7280">framework activities + umbrella activities</text>

  <line x1="380" y1="302" x2="380" y2="326" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#dn)"/>

  <polygon points="230,330 530,330 560,382 200,382" fill="#E5E7EB" stroke="#6B7280" stroke-width="2.5"/>
  <text x="380" y="362" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">A quality focus</text>

  <!-- side annotations (kept clear of the stack and the pedestal slope) -->
  <text x="540" y="66" font-size="15" font-style="italic" fill="#6B7280">tools do it faster</text>
  <text x="540" y="164" font-size="15" font-style="italic" fill="#6B7280">methods say how</text>
  <text x="540" y="266" font-size="15" font-style="italic" fill="#6B7280">process says when</text>
  <text x="580" y="360" font-size="15" font-style="italic" fill="#6B7280">the bedrock</text>
</svg>
