<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 12 755 407" font-family="Arial"><defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs><rect x="3" y="12" width="755" height="407" fill="#FFFFFF"/><text x="380" y="38" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold" font-style="normal">Attribute mistaken for a concept: the key-box code</text><rect x="20" y="64" width="350" height="300" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.2"/><rect x="20" y="64" width="350" height="52" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.2"/><text x="195" y="90" text-anchor="middle" font-size="12.5" fill="#DC2626" font-weight="bold" font-style="normal">A field on Resident</text><text x="195" y="107" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">the version the team drew first</text><text x="34" y="142" text-anchor="start" font-size="11.5" fill="#DC2626" font-weight="bold" font-style="normal">IDENTITY</text><text x="34" y="162" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">No. Four digits — and the</text><text x="34" y="177" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">second resident's card holds</text><text x="34" y="192" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">the same four.</text><text x="34" y="222" text-anchor="start" font-size="11.5" fill="#DC2626" font-weight="bold" font-style="normal">INDEPENDENT LIFE</text><text x="34" y="242" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Yes — but not of the resident.</text><text x="34" y="257" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">It changes when the lock does.</text><text x="34" y="287" text-anchor="start" font-size="11.5" fill="#DC2626" font-weight="bold" font-style="normal">SHARING</text><text x="34" y="307" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Yes. Two residents in one</text><text x="34" y="322" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">building share one box.</text><rect x="34" y="336" width="322" height="26" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="46" y="353" text-anchor="start" font-size="11.5" fill="#DC2626" font-weight="bold" font-style="normal">Verdict: an attribute of the wrong concept</text><rect x="390" y="64" width="350" height="300" rx="10" fill="#FFFFFF" stroke="#2E7D46" stroke-width="2.2"/><rect x="390" y="64" width="350" height="52" rx="10" fill="#DCFCE7" stroke="#2E7D46" stroke-width="2.2"/><text x="565" y="90" text-anchor="middle" font-size="12.5" fill="#2E7D46" font-weight="bold" font-style="normal">An attribute of Address</text><text x="565" y="107" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">after the three tests</text><text x="404" y="142" text-anchor="start" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">IDENTITY</text><text x="404" y="162" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Yes. This box, at this door.</text><text x="404" y="192" text-anchor="start" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">INDEPENDENT LIFE</text><text x="404" y="212" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Yes. Re-coded once, for every</text><text x="404" y="227" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">resident behind it.</text><text x="404" y="257" text-anchor="start" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">SHARING</text><text x="404" y="277" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Yes — and this is the point.</text><text x="404" y="292" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Two residents, one door, one box.</text><rect x="404" y="336" width="322" height="26" rx="6" fill="#DCFCE7" stroke="#2E7D46" stroke-width="1.4"/><text x="416" y="353" text-anchor="start" font-size="11.5" fill="#2E7D46" font-weight="bold" font-style="normal">Verdict: a fact owned by a door</text><text x="380" y="400" text-anchor="middle" font-size="12" fill="#6B7280" font-weight="normal" font-style="italic">The three tests do not stop at concept or attribute. They name which concept owns the fact.</text></svg>