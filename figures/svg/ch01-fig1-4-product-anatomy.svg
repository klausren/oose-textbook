<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" font-family="Arial">
  <defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs>
  <rect x="0" y="0" width="760" height="486" fill="#FFFFFF"/>
<rect x="50" y="26" width="660" height="196" rx="12" fill="#F5F6F7" stroke="#C9D4E2" stroke-width="2"/>
  <text x="380" y="58" text-anchor="middle" font-size="16" fill="#1F2937" font-weight="bold" font-style="normal">A software product is more than programs</text>
  <rect x="78" y="78" width="188" height="124" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="172" y="116" text-anchor="middle" font-size="17" fill="#2563EB" font-weight="bold" font-style="normal">Programs</text>
  <text x="172" y="146" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">executable instructions</text>
<text x="172" y="162" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">and their libraries</text>
  <rect x="286" y="78" width="188" height="124" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
  <text x="380" y="116" text-anchor="middle" font-size="17" fill="#0D9488" font-weight="bold" font-style="normal">Data</text>
  <text x="380" y="146" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">schemas, configuration,</text>
<text x="380" y="162" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">user content</text>
  <rect x="494" y="78" width="188" height="124" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="588" y="116" text-anchor="middle" font-size="17" fill="#D97706" font-weight="bold" font-style="normal">Documents</text>
  <text x="588" y="146" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">requirements, design,</text>
<text x="588" y="162" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">tests, manuals</text>
  <path d="M 380,222 L 380,248 L 219,248 L 219,266" fill="none" stroke="#1F2937" stroke-width="2.5" marker-end="url(#arrK)"/>
  <path d="M 380,222 L 380,248 L 541,248 L 541,266" fill="none" stroke="#1F2937" stroke-width="2.5" marker-end="url(#arrK)"/>
  <rect x="78" y="272" width="282" height="162" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2"/>
  <rect x="78" y="272" width="282" height="38" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
  <text x="219" y="298" text-anchor="middle" font-size="14.5" fill="#2563EB" font-weight="bold" font-style="normal">Generic products</text>
  <text x="219" y="332" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">Built for a market of many unknown buyers.</text>
<text x="219" y="348" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">The vendor decides what to build; the</text>
<text x="219" y="364" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">requirements are the vendor's research</text>
<text x="219" y="380" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">problem.</text>
  <text x="219" y="416" text-anchor="middle" font-size="11.5" fill="#2563EB" font-weight="normal" font-style="italic">Example: a photo editor you download</text>
  <rect x="400" y="272" width="282" height="162" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2.2"/>
  <rect x="400" y="272" width="282" height="38" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2"/>
  <text x="541" y="298" text-anchor="middle" font-size="14.5" fill="#D97706" font-weight="bold" font-style="normal">Customized products</text>
  <text x="541" y="332" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">Built for one customer who states the</text>
<text x="541" y="348" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">requirements. The customer, not the vendor,</text>
<text x="541" y="364" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">owns every later decision.</text>
  <text x="541" y="416" text-anchor="middle" font-size="11.5" fill="#D97706" font-weight="normal" font-style="italic">Example: CareLink for one care centre</text>
  <text x="380" y="462" text-anchor="middle" font-size="12.5" fill="#6B7280" font-weight="normal" font-style="italic">Whoever writes the requirements owns every later decision about scope.</text></svg>
