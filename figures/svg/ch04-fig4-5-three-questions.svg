<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" font-family="Arial">
  <defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
  <rect x="0" y="0" width="760" height="396" fill="#FFFFFF"/>
<rect x="30" y="40" width="220" height="300" rx="12" fill="#FFFFFF" stroke="#6B7280" stroke-width="2.5"/>
  <rect x="30" y="40" width="220" height="48" rx="12" fill="#F5F6F7" stroke="#6B7280" stroke-width="2.5"/>
  <rect x="30" y="64" width="220" height="24" fill="#F5F6F7"/>
  <text x="140" y="71" text-anchor="middle" font-size="17" fill="#1F2937" font-weight="bold" font-style="normal">Closed</text>
  <text x="140" y="130" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="normal" font-style="normal">Do you want alerts?</text>
  <line x1="54" y1="232" x2="226" y2="232" stroke="#C9D4E2" stroke-width="2"/>
  <circle cx="140" cy="262" r="12" fill="#DC2626"/><path d="M 136,258 l 8,8 M 144,258 l -8,8" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <text x="140" y="300" text-anchor="middle" font-size="12" fill="#DC2626" font-weight="normal" font-style="normal">Yes. Now what?</text>
  <rect x="270" y="40" width="220" height="300" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2.5"/>
  <rect x="270" y="40" width="220" height="48" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <rect x="270" y="64" width="220" height="24" fill="#FEF3C7"/>
  <text x="380" y="71" text-anchor="middle" font-size="17" fill="#1F2937" font-weight="bold" font-style="normal">Leading</text>
  <text x="380" y="130" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="normal" font-style="normal">You'd want the alert</text>
<text x="380" y="150" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="normal" font-style="normal">within a minute, right?</text>
  <line x1="294" y1="232" x2="466" y2="232" stroke="#C9D4E2" stroke-width="2"/>
  <circle cx="380" cy="262" r="12" fill="#DC2626"/><path d="M 376,258 l 8,8 M 384,258 l -8,8" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <text x="380" y="300" text-anchor="middle" font-size="12" fill="#DC2626" font-weight="normal" font-style="normal">Agreement is not</text>
<text x="380" y="315" text-anchor="middle" font-size="12" fill="#DC2626" font-weight="normal" font-style="normal">information.</text>
  <rect x="510" y="40" width="220" height="300" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="510" y="40" width="220" height="48" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="510" y="64" width="220" height="24" fill="#DBEAFE"/>
  <text x="620" y="71" text-anchor="middle" font-size="17" fill="#1F2937" font-weight="bold" font-style="normal">Open</text>
  <text x="620" y="130" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="normal" font-style="normal">Walk me through last</text>
<text x="620" y="150" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="normal" font-style="normal">Tuesday.</text>
  <line x1="534" y1="232" x2="706" y2="232" stroke="#C9D4E2" stroke-width="2"/>
  <circle cx="620" cy="262" r="12" fill="#2E7D46"/><path d="M 616,262 l 3,3.5 l 5,-6.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <text x="620" y="300" text-anchor="middle" font-size="12" fill="#2E7D46" font-weight="normal" font-style="normal">A story — the only shape</text>
<text x="620" y="315" text-anchor="middle" font-size="12" fill="#2E7D46" font-weight="normal" font-style="normal">that surprises you.</text>
  <text x="380" y="372" text-anchor="middle" font-size="13" fill="#6B7280" font-weight="normal" font-style="italic">One request, three shapes. Only one of them can produce a surprise.</text></svg>
