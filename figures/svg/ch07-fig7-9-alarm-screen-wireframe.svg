  <text x="498" y="366" text-anchor="start" font-size="10.5" fill="#6B7280" font-weight="normal" font-style="normal">Closing an alert with no safety</text>
<text x="498" y="380" text-anchor="start" font-size="10.5" fill="#6B7280" font-weight="normal" font-style="normal">confirmation. This is the row</text>
