<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Arial"><defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs><rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/><text x="10" y="40" text-anchor="start" font-size="17" fill="#1F2937" font-weight="bold" font-style="normal">Why baselines exist</text><text x="10" y="62" text-anchor="start" font-size="12.5" fill="#6B7280" font-weight="normal" font-style="normal">The same change request, with one difference: a version number</text><rect x="10" y="84" width="740" height="132" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="26" y="110" text-anchor="start" font-size="13.5" fill="#2563EB" font-weight="bold" font-style="normal">With a baseline: v1.2</text><line x1="60" y1="156" x2="700" y2="156" stroke="#2563EB" stroke-width="2.4"/><circle cx="60" cy="156" r="7" fill="#2563EB"/><text x="60" y="140" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">v1.0</text><circle cx="212" cy="156" r="7" fill="#2563EB"/><text x="212" y="140" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">v1.1</text><circle cx="364" cy="156" r="7" fill="#2563EB"/><text x="364" y="140" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">v1.2</text><circle cx="516" cy="156" r="7" fill="#2563EB"/><text x="516" y="140" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">change</text><text x="380" y="180" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Every requirement can be answered from the version that was current when it was written.</text><text x="700" y="140" text-anchor="end" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">time</text><rect x="10" y="232" width="740" height="132" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="26" y="258" text-anchor="start" font-size="13.5" fill="#DC2626" font-weight="bold" font-style="normal">Without a baseline: main</text><line x1="60" y1="304" x2="700" y2="304" stroke="#DC2626" stroke-width="2.4"/><circle cx="60" cy="304" r="7" fill="#DC2626"/><text x="60" y="288" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">as written</text><circle cx="212" cy="304" r="7" fill="#DC2626"/><text x="212" y="288" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">informally edited</text><circle cx="364" cy="304" r="7" fill="#DC2626"/><text x="364" y="288" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">edited again</text><circle cx="516" cy="304" r="7" fill="#DC2626"/><text x="516" y="288" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="bold" font-style="normal">change</text><text x="380" y="328" text-anchor="middle" font-size="11.5" fill="#DC2626" font-weight="normal" font-style="normal">Nobody can say which sentence the design was built from, so nobody can cost the change.</text><text x="700" y="288" text-anchor="end" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">time</text><text x="380" y="382" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold" font-style="normal">A baseline is not bureaucracy. It is the answer to “which version did you agree to?”</text></svg>