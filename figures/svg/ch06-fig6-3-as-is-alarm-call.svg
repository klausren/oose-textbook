  <circle cx="280" cy="698" r="11" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.6"/>
  <circle cx="280" cy="698" r="6" fill="#1F2937"/>
  <text x="304" y="703" text-anchor="start" font-size="11.5" fill="#DC2626" font-weight="bold" font-style="normal">caregiver on site at 00:32  —  112 minutes</text>
