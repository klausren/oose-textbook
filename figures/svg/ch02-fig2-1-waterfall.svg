      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="430" fill="#FFFFFF"/>

  <!-- cascade boxes -->
  <g>
    <rect x="42" y="28" width="180" height="58" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
    <text x="132" y="52" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">Communication</text>
    <text x="132" y="72" text-anchor="middle" font-size="13" fill="#6B7280">requirements</text>

    <rect x="174" y="106" width="180" height="58" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
    <text x="264" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">Planning</text>
    <text x="264" y="150" text-anchor="middle" font-size="13" fill="#6B7280">project plan</text>

    <rect x="306" y="184" width="180" height="58" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
    <text x="396" y="208" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">Modeling</text>
    <text x="396" y="228" text-anchor="middle" font-size="13" fill="#6B7280">analysis &amp; design</text>

    <rect x="438" y="262" width="180" height="58" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
    <text x="528" y="286" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">Construction</text>
    <text x="528" y="306" text-anchor="middle" font-size="13" fill="#6B7280">code &amp; test</text>

    <rect x="570" y="340" width="180" height="58" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
    <text x="660" y="364" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">Deployment</text>
    <text x="660" y="384" text-anchor="middle" font-size="13" fill="#6B7280">delivery &amp; support</text>
  </g>

  <!-- arrows on top of boxes so arrowheads remain visible -->
  <g stroke="#2563EB" stroke-width="2.5" fill="none">
    <path d="M 222,57 H 266 V 106" marker-end="url(#arrB)"/>
    <path d="M 354,135 H 398 V 184" marker-end="url(#arrB)"/>
    <path d="M 486,213 H 530 V 262" marker-end="url(#arrB)"/>
