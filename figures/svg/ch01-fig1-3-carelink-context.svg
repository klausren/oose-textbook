<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" font-family="Arial">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="t" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/>
    </marker>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- elder's home -->
  <rect x="25" y="95" width="195" height="160" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2.5"/>
  <text x="122" y="122" text-anchor="middle" font-size="19" font-weight="bold" fill="#1F2937">Elder's Home</text>
  <text x="122" y="148" text-anchor="middle" font-size="14" fill="#6B7280">wristband · heart rate · fall</text>
  <text x="122" y="170" text-anchor="middle" font-size="14" fill="#6B7280">motion sensor</text>
  <text x="122" y="192" text-anchor="middle" font-size="14" fill="#6B7280">kettle sensor</text>
  <text x="122" y="236" text-anchor="middle" font-size="15" font-style="italic" fill="#1F2937">Grandma Lin</text>

  <!-- platform -->
  <rect x="280" y="115" width="205" height="120" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
  <text x="382" y="152" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F2937">CareLink</text>
  <text x="382" y="176" text-anchor="middle" font-size="14" fill="#374151">signal fusion · alert levels</text>
  <text x="382" y="197" text-anchor="middle" font-size="14" fill="#374151">daily report · escalation rules</text>

  <!-- family app -->
  <rect x="545" y="40" width="195" height="88" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5"/>
  <text x="642" y="68" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">Family App</text>
  <text x="642" y="90" text-anchor="middle" font-size="14" fill="#6B7280">status · alerts · daily summary</text>
  <text x="642" y="115" text-anchor="middle" font-size="15" font-style="italic" fill="#1F2937">Wei (son)</text>

  <!-- care center -->
  <rect x="545" y="165" width="195" height="88" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="642" y="193" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">Care Center 24/7</text>
  <text x="642" y="215" text-anchor="middle" font-size="14" fill="#6B7280">triage · call · verify</text>
  <text x="642" y="240" text-anchor="middle" font-size="15" font-style="italic" fill="#1F2937">operator Yan</text>

  <!-- emergency -->
  <rect x="545" y="285" width="195" height="62" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="642" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#991B1B">Emergency services</text>
  <text x="642" y="332" text-anchor="middle" font-size="13" fill="#991B1B">last resort · L3 only</text>

  <!-- arrows -->
  <line x1="220" y1="175" x2="276" y2="175" stroke="#2563EB" stroke-width="3" marker-end="url(#b)"/>
  <text x="248" y="163" text-anchor="middle" font-size="13" fill="#2563EB">vitals &amp; events</text>

  <line x1="485" y1="155" x2="541" y2="92" stroke="#0D9488" stroke-width="3" marker-end="url(#t)"/>
  <text x="528" y="115" text-anchor="middle" font-size="13" fill="#0D9488">status &amp; alerts</text>

  <line x1="485" y1="195" x2="541" y2="205" stroke="#D97706" stroke-width="3" marker-end="url(#a)"/>
  <text x="528" y="192" text-anchor="middle" font-size="13" fill="#D97706">urgent alerts</text>

  <line x1="642" y1="253" x2="642" y2="281" stroke="#DC2626" stroke-width="3" marker-end="url(#r)"/>
  <text x="668" y="271" font-size="13" fill="#DC2626">dispatch</text>
</svg>
