<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Arial"><defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs><rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/><text x="10" y="40" text-anchor="start" font-size="17" fill="#1F2937" font-weight="bold" font-style="normal">The validation loop</text><text x="10" y="62" text-anchor="start" font-size="12.5" fill="#6B7280" font-weight="normal" font-style="normal">Four checks, run until every requirement is traced, testable and agreed</text><rect x="10" y="84" width="171" height="176" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="22" y="110" text-anchor="start" font-size="13.5" fill="#2563EB" font-weight="bold" font-style="normal">1  Inspect</text><text x="95.5" y="134" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">The specification is read</text><text x="95.5" y="149" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">against the models: does</text><text x="95.5" y="164" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">every sentence in the</text><text x="95.5" y="179" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">document have a diagram</text><text x="95.5" y="194" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">behind it?</text><line x1="184" y1="172" x2="197" y2="172" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arrB)"/><rect x="200" y="84" width="171" height="176" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/><text x="212" y="110" text-anchor="start" font-size="13.5" fill="#0D9488" font-weight="bold" font-style="normal">2  Review</text><text x="285.5" y="134" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Stakeholders walk the</text><text x="285.5" y="149" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">scenarios out loud. Mei</text><text x="285.5" y="164" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">and Deng read the same</text><text x="285.5" y="179" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">sentence and disagree in</text><text x="285.5" y="194" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">public.</text><line x1="374" y1="172" x2="387" y2="172" stroke="#0D9488" stroke-width="2.4" marker-end="url(#arrB)"/><rect x="390" y="84" width="171" height="176" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="402" y="110" text-anchor="start" font-size="13.5" fill="#D97706" font-weight="bold" font-style="normal">3  Test</text><text x="475.5" y="134" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Each acceptance criterion</text><text x="475.5" y="149" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">is handed to the person</text><text x="475.5" y="164" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">who will write the test.</text><text x="475.5" y="179" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">If they cannot write one,</text><text x="475.5" y="194" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">the criterion is not</text><text x="475.5" y="209" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">written yet.</text><line x1="564" y1="172" x2="577" y2="172" stroke="#D97706" stroke-width="2.4" marker-end="url(#arrB)"/><rect x="580" y="84" width="171" height="176" rx="10" fill="#DCFCE7" stroke="#2E7D46" stroke-width="2"/><text x="592" y="110" text-anchor="start" font-size="13.5" fill="#2E7D46" font-weight="bold" font-style="normal">4  Agree</text><text x="665.5" y="134" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">The requirement set is</text><text x="665.5" y="149" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">signed and frozen.</text><text x="665.5" y="164" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">Signing is a decision,</text><text x="665.5" y="179" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">not a formality: it</text><text x="665.5" y="194" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">commits the project to a</text><text x="665.5" y="209" text-anchor="middle" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">scope.</text><line x1="94" y1="264" x2="94" y2="294" stroke="#6B7280" stroke-width="2.4"/><line x1="94" y1="294" x2="666" y2="294" stroke="#6B7280" stroke-width="2.4"/><line x1="666" y1="294" x2="666" y2="264" stroke="#6B7280" stroke-width="2.4" marker-end="url(#arrG)"/><text x="380" y="314" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="italic">each finding returns to the source it came from</text><text x="380" y="342" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold" font-style="normal">Exit condition: every requirement is traced to a source, testable, and agreed by the customer.</text><text x="380" y="362" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="italic">Without a stated exit condition, validation continues until the schedule ends it.</text></svg>