<svg xmlns="http://www.w3.org/2000/svg" viewBox="31 71 698 314" font-family="Arial">
  <defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D3FA8"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D46"/></marker></defs>
  <rect x="31" y="71" width="698" height="314" fill="#FFFFFF"/>
<rect x="48" y="96" width="210" height="220" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
  <text x="153" y="128" text-anchor="middle" font-size="14" fill="#2563EB" font-weight="bold" font-style="normal">Product Backlog</text>
  <text x="153" y="152" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">everything potentially</text>
<text x="153" y="167" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">wanted, in one list ordered</text>
<text x="153" y="182" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">by value</text>
  <rect x="66" y="204" width="174" height="20" rx="4" fill="#FFFFFF" stroke="#C9D4E2" stroke-width="1.5"/>
  <rect x="66" y="230" width="174" height="20" rx="4" fill="#FFFFFF" stroke="#C9D4E2" stroke-width="1.5"/>
  <rect x="66" y="256" width="174" height="20" rx="4" fill="#FFFFFF" stroke="#C9D4E2" stroke-width="1.5"/>
  <rect x="66" y="282" width="174" height="20" rx="4" fill="#FFFFFF" stroke="#C9D4E2" stroke-width="1.5"/>
  <text x="76" y="218" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">alert within 10 s</text>
  <text x="76" y="244" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">heart-rate threshold rule</text>
  <text x="76" y="270" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">weekly report for the family</text>
  <text x="76" y="296" text-anchor="start" font-size="11.5" fill="#1F2937" font-weight="normal" font-style="normal">care-centre console</text>
  <line x1="258" y1="206" x2="296" y2="206" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB)"/>
  <text x="277" y="226" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="italic">selected</text>
  <rect x="302" y="88" width="190" height="236" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="397" y="110" text-anchor="middle" font-size="11.5" fill="#D97706" font-weight="bold" font-style="normal">ONE SPRINT</text>
  <rect x="318" y="124" width="158" height="150" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.2"/>
  <text x="397" y="150" text-anchor="middle" font-size="12.5" fill="#0D9488" font-weight="bold" font-style="normal">Sprint Backlog</text>
  <text x="397" y="176" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">the why (Sprint Goal),</text>
<text x="397" y="191" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">the what (selected</text>
<text x="397" y="206" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">items) and the how (the</text>
<text x="397" y="221" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">plan)</text>
  <text x="397" y="264" text-anchor="middle" font-size="11.5" fill="#0D9488" font-weight="normal" font-style="italic">1 to 4 weeks</text>
  <line x1="492" y1="206" x2="536" y2="206" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrT)"/>
  <text x="512" y="178" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">meets the</text>
<text x="512" y="191" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">DoD</text>
  <rect x="542" y="124" width="170" height="150" rx="10" fill="#DCFCE7" stroke="#2E7D46" stroke-width="2.2"/>
  <text x="627" y="150" text-anchor="middle" font-size="13.5" fill="#2E7D46" font-weight="bold" font-style="normal">Increment</text>
  <text x="627" y="176" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">a usable slice that adds</text>
<text x="627" y="191" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">to everything built before</text>
<text x="627" y="206" text-anchor="middle" font-size="11.5" fill="#6B7280" font-weight="normal" font-style="normal">it</text>
  <text x="627" y="264" text-anchor="middle" font-size="11.5" fill="#2E7D46" font-weight="normal" font-style="italic">someone can use it</text>
  <text x="380" y="366" text-anchor="middle" font-size="12.5" fill="#6B7280" font-weight="normal" font-style="italic">The Product Backlog is never finished. The Increment is the only artefact anyone can use.</text></svg>
