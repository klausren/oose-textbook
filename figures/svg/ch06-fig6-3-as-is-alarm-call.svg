<text x="280.0" y="579" text-anchor="middle" font-size="10.5" fill="#2563EB" font-weight="normal" font-style="normal">12 min</text>
  <rect x="90" y="608" width="380" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2"/>
