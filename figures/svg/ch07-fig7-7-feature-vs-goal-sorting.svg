  <text x="380" y="600" text-anchor="middle" font-size="11.5" fill="#D97706" font-weight="normal" font-style="normal">▲ added by the regrouping. Confirm the resident is safe was buried in A6 of Acknowledge an</text>
<text x="380" y="616" text-anchor="middle" font-size="11.5" fill="#D97706" font-weight="normal" font-style="normal">alert; Maintain contact records was absent entirely.</text></svg>
